<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon verre d'eau</title>
</head>
<body style="margin:0; padding:24px 12px; background:#F0EDF7; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<div id="blender-checklist-root"></div>
<style>
  #blender-checklist-root {
    --purple: #5B3A8E;
    --purple-dark: #3B2760;
    --teal: #1F8A87;
    --gold: #C9A227;
    --cream: #FBF9F5;
    --ink: #2B2438;
    --grey: #6E6A78;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    border-radius: 20px;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(43,36,56,0.08);
  }

  .bc-hero {
    background: linear-gradient(135deg, var(--purple-dark), #4A3170);
    color: #fff;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .bc-hero::after {
    content: "";
    position: absolute;
    top: -60px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(201,162,39,0.18);
  }
  .bc-lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    z-index: 2;
  }
  .bc-lang-btn {
    border: none;
    background: transparent;
    color: #D9CFEE;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .bc-lang-btn.active {
    background: var(--gold);
    color: var(--purple-dark);
  }
  .bc-eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
    position: relative;
  }
  .bc-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    position: relative;
    padding-right: 90px;
  }
  .bc-sub {
    font-size: 13px;
    color: #D9CFEE;
    margin: 0 0 20px;
    position: relative;
    max-width: 480px;
  }
  .bc-progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bc-progress-track {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .bc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .bc-progress-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }

  .bc-body { padding: 10px 20px 22px; }

  .bc-section {
    border: 1px solid #E8E2D8;
    background: #fff;
    border-radius: 14px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bc-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    border-left: 5px solid var(--accent, var(--purple));
  }
  .bc-section-head:hover { background: #FBF9F5; }
  .bc-section-titlewrap { display: flex; flex-direction: column; gap: 2px; }
  .bc-section-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent, var(--purple));
  }
  .bc-section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .bc-section-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bc-count {
    font-size: 11.5px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 34px;
    text-align: right;
  }
  .bc-chevron {
    width: 18px; height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--grey);
  }
  .bc-section.open .bc-chevron { transform: rotate(180deg); }

  .bc-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .bc-section.open .bc-items { max-height: 3200px; }

  .bc-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 10px 16px 0;
    padding: 9px 12px;
    background: rgba(31,138,135,0.08);
    border: 1px solid rgba(31,138,135,0.35);
    border-radius: 10px;
    font-size: 11.8px;
    line-height: 1.35;
    color: var(--ink);
  }
  .bc-note strong { color: var(--teal); }
  .bc-note.warn {
    background: rgba(201,162,39,0.1);
    border-color: rgba(201,162,39,0.45);
  }

  .bc-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px 10px 20px;
    border-top: 1px solid #F1EDE3;
  }
  .bc-checkbox {
    margin-top: 2px;
    width: 19px; height: 19px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 2px solid #D7CFE6;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bc-checkbox.checked {
    background: var(--accent, var(--purple));
    border-color: var(--accent, var(--purple));
  }
  .bc-checkbox svg { width: 12px; height: 12px; opacity: 0; }
  .bc-checkbox.checked svg { opacity: 1; }
  .bc-item-textwrap { cursor: pointer; }
  .bc-item-text {
    font-size: 13.3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .bc-item-hint {
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--accent, var(--purple));
    margin-top: 3px;
    opacity: 0.85;
  }
  .bc-item-hint::before {
    content: "📍 ";
  }
  .bc-item-why {
    font-size: 11.8px;
    line-height: 1.42;
    color: var(--ink);
    margin-top: 6px;
    padding: 7px 10px;
    background: rgba(31,138,135,0.07);
    border-left: 3px solid var(--teal);
    border-radius: 4px;
    opacity: 0.92;
  }
  .bc-item-why::before {
    content: "💡 ";
  }
  .bc-item-warn {
    font-size: 11.8px;
    line-height: 1.42;
    color: var(--ink);
    margin-top: 6px;
    padding: 7px 10px;
    background: rgba(201,162,39,0.1);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    opacity: 0.92;
  }
  .bc-item-warn::before {
    content: "⚠️ ";
  }
  .bc-item-confirm {
    font-size: 11.8px;
    line-height: 1.42;
    color: var(--ink);
    margin-top: 6px;
    padding: 7px 10px;
    background: rgba(31,138,135,0.07);
    border-left: 3px solid var(--purple);
    border-radius: 4px;
    opacity: 0.92;
  }
  .bc-item-confirm::before {
    content: "✅ ";
  }
  .bc-item.done .bc-item-text {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: #C9BFDD;
  }
  .bc-item.done .bc-item-hint { opacity: 0.4; }
  .bc-item.done .bc-item-why { opacity: 0.4; }
  .bc-item.done .bc-item-warn { opacity: 0.4; }
  .bc-item.done .bc-item-confirm { opacity: 0.4; }

  .bc-footer {
    padding: 4px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bc-reset {
    font-size: 12px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .bc-savenote {
    font-size: 11px;
    color: #A79EC0;
  }
</style>
<script>
(function () {
  const UI = {
    fr: {
      eyebrow: "Pratique personnelle",
      title: "Mon verre d'eau",
      sub: "Coche chaque étape en suivant la transcription complète du tuto. Le 📍 indique où trouver l'outil à l'écran, le 💡 explique pourquoi on fait ce geste.",
      reset: "Réinitialiser ma progression",

      noteIcon: "🔍"
    },
    en: {
      eyebrow: "Personal practice",
      title: "My glass of water",
      sub: "Check off each step while following the tutorial's full transcript. The 📍 shows you where to find the tool on screen, the 💡 explains why you're doing this.",
      reset: "Reset my progress",
      saved: "Progress saved automatically",
      noteIcon: "🔍"
    }
  };

  const DATA = [
    {
      id: "s1", accent: "var(--purple)",
      title: { fr: "Modéliser le corps du verre", en: "Modelling the glass body" },
      eyebrow: { fr: "Étape 1", en: "Step 1" },
      items: [
        { fr: ["Placer la souris dans le viewport, tout sélectionner (A)", "Le viewport, c'est la grande zone grise centrale — tout devient orange une fois sélectionné"],
          en: ["Place the mouse in the viewport, select all (A)", "The viewport is the large central grey area — everything turns orange once selected"] },
        { fr: ["Supprimer la sélection (X, puis clic sur « Delete » dans le petit menu)", "X seul n'efface rien — il ouvre un menu, il faut cliquer sur Delete dedans"],
          en: ["Delete the selection (X, then click « Delete » in the small menu)", "X alone deletes nothing — it opens a menu, you need to click Delete inside it"] },
        { fr: ["Ouvrir le menu d'ajout (Shift+A, souris dans le viewport)", "Un menu apparaît juste à l'endroit où se trouve ta souris"],
          en: ["Open the Add menu (Shift+A, mouse in the viewport)", "A menu appears right where your mouse is"] },
        { fr: ["Survoler « Mesh », puis cliquer sur « Cylinder » dans la liste qui s'ouvre à côté", "Ne clique pas sur Mesh directement — juste le survoler ouvre le sous-menu"],
          en: ["Hover « Mesh », then click « Cylinder » in the list that opens next to it", "Don't click Mesh directly — just hovering it opens the submenu"] },
        { fr: ["Passer en Edit Mode : cliquer sur « Object Mode » en haut à gauche du viewport, choisir « Edit Mode »", "Ou plus rapide : touche Tab, souris dans le viewport"],
          en: ["Switch to Edit Mode: click « Object Mode » top-left of the viewport, choose « Edit Mode »", "Or faster: Tab key, mouse in the viewport"] },
        { fr: ["Activer le mode Face : cliquer sur la 3e des 3 petites icônes en haut du viewport (à côté de « Global »)", "Ou touche 3. Cette icône ressemble à un carré plein"],
          en: ["Turn on Face mode: click the 3rd of the 3 small icons at the top of the viewport (next to « Global »)", "Or the 3 key. This icon looks like a solid square"] },
        { fr: ["Cliquer une fois sur le disque plat tout en haut du cylindre pour le sélectionner", "Cette face devient orange — si tu cliques ailleurs sur le côté du cylindre, tu sélectionnes la mauvaise face, reclique sur le dessus"],
          en: ["Click once on the flat disc at the very top of the cylinder to select it", "That face turns orange — if you click the side of the cylinder instead, you've got the wrong face, click the top again"] },
        { fr: ["Étirer cette face vers le haut pour la hauteur du verre (G, puis Z, bouger la souris, clic gauche pour valider)", "G seul déplace dans tous les sens — Z juste après bloque le mouvement uniquement vers le haut/bas. À l'œil, pas de valeur exacte"],
          en: ["Stretch that face upward for the glass's height (G, then Z, move the mouse, left-click to confirm)", "G alone moves freely — Z right after locks the movement to up/down only. By eye, no exact value"] },
        { fr: ["Sur cette même face (toujours sélectionnée), Inset (I, bouger la souris, clic gauche)", "Regarde le nouveau petit contour se dessiner à l'intérieur pendant que tu bouges la souris — c'est l'épaisseur de la paroi"],
          en: ["On that same face (still selected), Inset (I, move the mouse, left-click)", "Watch the new small outline draw itself inside as you move the mouse — that's the wall thickness"] },
        { fr: ["Sur cette face réduite par l'Inset, creuser vers le bas (E, puis pousser la souris vers le bas ou scroller, clic gauche)", "C'est bien la petite face du milieu (celle de l'Inset) qu'il faut extruder, pas toute la face du dessus"],
          en: ["On that face shrunk by the Inset, hollow it downward (E, then push the mouse down or scroll, left-click)", "It's the small middle face (the Inset one) that needs extruding, not the whole top face"] },
        { fr: ["Si besoin, ajuster la hauteur du fond intérieur (G, Z)", "Astuce : Alt+Z (souris dans le viewport) affiche en transparence — utile pour voir si tu dépasses le fond extérieur"],
          en: ["If needed, adjust the height of the inner bottom (G, Z)", "Tip: Alt+Z (mouse in the viewport) shows X-ray mode — useful to check you're not going past the outer bottom"] },
        { fr: ["Passer en mode Vertex (touche 1), entourer les points du fond avec un cliquer-glisser, puis G, Z pour ajuster l'épaisseur", "Le cliquer-glisser doit englober uniquement les points du fond, pas ceux du haut du verre"],
          en: ["Switch to Vertex mode (1 key), click-drag a box around the bottom points, then G, Z to adjust the thickness", "The click-drag box must only cover the bottom points, not the ones at the top of the glass"] }
      ]
    },
    {
      id: "s2", accent: "var(--teal)",
      title: { fr: "Lisser et affiner la forme", en: "Smoothing and refining the shape" },
      eyebrow: { fr: "Étape 2", en: "Step 2" },
      note: { fr: "Après le Subdivision, vérifie le rendu : icônes de shading en haut à droite du viewport (Solid → Material Preview), ou vue caméra (0 du pavé numérique).",
              en: "After the Subdivision, check the result: shading icons top-right of the viewport (Solid → Material Preview), or camera view (0 on the numpad)." },
      items: [
        { fr: ["Comprendre ce qu'est une arête (Edge) et savoir la sélectionner", "Une arête, c'est le trait qui relie 2 points (vertices) — comme le fil d'un cube. Pour la sélectionner : mode Edge (touche 2, ou la 2e des 3 icônes en haut du viewport), puis clique directement sur le trait (pas sur un point, pas à l'intérieur d'une face) — il devient orange"],
          en: ["Understand what an edge is and how to select one", "An edge is the line connecting 2 points (vertices) — like the wire of a cube. To select it: Edge mode (2 key, or the 2nd of the 3 icons at the top of the viewport), then click directly on the line (not a point, not inside a face) — it turns orange"] },
        { fr: ["Retourner en Object Mode (Tab)", "Pour accéder aux modifiers"],
          en: ["Go back to Object Mode (Tab)", "To access the modifiers"] },
        { fr: ["Ajouter le modifier Subdivision Surface (Add Modifier > Generate > Subdivision Surface)", "Icône clé à molette en bas à droite — bien dans « Generate », pas « Edit »"],
          en: ["Add the Subdivision Surface modifier (Add Modifier > Generate > Subdivision Surface)", "Wrench icon bottom-right — under « Generate », not « Edit »"] },
        { fr: ["Augmenter le niveau du Subdivision Surface à 3", "Champ Levels Viewport dans le modifier"],
          en: ["Increase the Subdivision Surface level to 3", "Levels Viewport field in the modifier"] },
        { fr: ["Repasser en Edit Mode, sélectionner le fond intérieur du verre (celui creusé à l'Étape 1) : Inset deux fois (I, I)", "2x Inset resserre les arêtes autour du fond, ce qui empêche le Subdivision Surface de l'arrondir en bosse — comme un pli de papier repassé deux fois"],
          en: ["Switch back to Edit Mode, select the glass's inner bottom (the one hollowed out in Step 1): Inset twice (I, I)", "2x Inset tightens the edges around the bottom, which stops the Subdivision Surface from rounding it into a dome — like a paper crease pressed twice"] },
        { fr: ["Loop Cut sur les arêtes verticales, glisser vers le bas pour aplatir la base (Ctrl/Cmd+R)", "Réduit l'effet trop sphérique du Subdivision en dessous",
               "Sans rien pour la retenir, la base du verre gonflerait comme un ballon sous l'effet du Subdivision Surface, qui arrondit tout par défaut. En ajoutant une boucle d'arêtes juste à côté du bord inférieur, tu donnes au Subdivision un point d'appui proche : les faces entre cette boucle et le bord n'ont presque plus de place pour s'arrondir, donc la base reste plate.",
               "Erreur fréquente : survoler une arête sans appuyer sur Ctrl+R ne fait apparaître qu'une fine ligne verticale unique (simple surbrillance) — ce n'est pas un Loop Cut. Et Ctrl+A ou A sélectionnent tout l'objet (tout devient orange), ce n'est pas ça non plus. Le vrai Loop Cut se reconnaît à un anneau jaune horizontal complet qui fait tout le tour du cylindre dès que tu maintiens Ctrl+R avec la souris sur le côté de l'objet, avant même de cliquer.",
               "Après le 1er clic gauche, tu dois voir 2 anneaux distincts : une ligne noire fixe (déjà créée) et une ligne jaune qui suit encore ta souris — et le petit panneau en bas à gauche du viewport affiche « Loop Cut and Slide ». C'est le signal que tu es au bon endroit. Bouge la souris pour glisser cet anneau (vers le bas pour la 1ère coupe), puis 2e clic gauche pour valider sa position. Pour une valeur précise plutôt qu'à l'œil : déplie ce panneau « Loop Cut and Slide » et tape une valeur dans le champ Factor (ex. -0.9)."],
          en: ["Loop Cut on the vertical edges, slide down to flatten the base (Ctrl/Cmd+R)", "Reduces the overly spherical effect of the Subdivision underneath",
               "Without anything to hold it back, the glass's base would balloon out under the Subdivision Surface, which rounds everything by default. Adding a loop of edges close to the bottom border gives the Subdivision a nearby anchor point: the faces between that loop and the border barely have room to round off, so the base stays flat.",
               "Common mistake: hovering an edge without pressing Ctrl+R only shows a single thin vertical line (plain highlight) — that's not a Loop Cut. And Ctrl+A or A select the whole object (everything turns orange), that's not it either. A real Loop Cut shows as a complete horizontal yellow ring going all the way around the cylinder as soon as you hold Ctrl+R with the mouse over the side of the object, even before clicking.",
               "After the first left-click, you should see 2 distinct rings: a fixed black line (already created) and a yellow line still following your mouse — and the small panel bottom-left of the viewport shows « Loop Cut and Slide ». That confirms you're on the right track. Move the mouse to slide that ring (downward for this first cut), then left-click again to confirm its position. For a precise value instead of eyeballing it: expand that « Loop Cut and Slide » panel and type a value in the Factor field (e.g. -0.9)."] },
        { fr: ["Loop Cut près du haut, glisser vers le haut (Ctrl/Cmd+R)", "Même geste, côté opposé",
               "Même logique, côté opposé. Sans cette boucle, le bord supérieur du verre (le rebord où on boit) serait lui aussi aspiré vers l'intérieur par l'arrondi du Subdivision, et le verre perdrait son ouverture nette. Cette coupe garde le rebord droit et net.",
               null,
               "Même méthode de validation que le 1er Loop Cut : 1er clic pour créer l'anneau (2 lignes visibles + panneau « Loop Cut and Slide » en bas à gauche), glisser vers le haut cette fois, 2e clic pour valider."],
          en: ["Loop Cut near the top, slide up (Ctrl/Cmd+R)", "Same gesture, opposite side",
               "Same logic, opposite side. Without this loop, the glass's top rim (where you'd drink from) would also get pulled inward by the Subdivision's rounding, and the glass would lose its clean opening. This cut keeps the rim straight and crisp.",
               null,
               "Same confirmation method as the first Loop Cut: 1st click creates the ring (2 visible lines + « Loop Cut and Slide » panel bottom-left), slide upward this time, 2nd click to confirm."] },
        { fr: ["Loop Cut à l'intérieur, glisser vers le haut pour l'épaisseur (Ctrl/Cmd+R)", "Sur les arêtes intérieures du verre",
               "À ce stade, le verre a déjà une paroi intérieure (le creux dans lequel on verserait un liquide). Cette boucle contrôle l'épaisseur du bord supérieur de cette paroi intérieure, pour qu'elle reste régulière une fois lissée, plutôt que de s'amincir ou se déformer sous le Subdivision.",
               null,
               "Même méthode de validation : 1er clic pour créer l'anneau, glisser légèrement, 2e clic pour valider. Cette fois l'anneau se trouve sur la paroi intérieure du verre, pas sur l'extérieur — vérifie bien que tu as sélectionné une arête intérieure avant Ctrl+R."],
          en: ["Loop Cut on the inside, slide up for thickness (Ctrl/Cmd+R)", "On the glass's inner edges",
               "At this stage, the glass already has an inner wall (the hollow you'd pour a liquid into). This loop controls the thickness of that inner wall's top edge, so it stays even once smoothed, rather than thinning out or warping under the Subdivision.",
               null,
               "Same confirmation method: 1st click creates the ring, slide slightly, 2nd click to confirm. This time the ring sits on the glass's inner wall, not the outer one — make sure you're hovering an inner edge before Ctrl+R."] },
        { fr: ["Loop Cut en bas à l'intérieur, réduire légèrement (Ctrl/Cmd+R)", "Finalise l'épaisseur du fond",
               "Même principe, mais pour le fond intérieur du verre. Cette dernière coupe fixe l'épaisseur du fond une fois pour toutes, pour que le lissage final ne la fasse pas disparaître ou trop s'amincir — c'est ce qui termine proprement la double paroi du verre (extérieure + intérieure).",
               null,
               "Dernière application de la même méthode : 1er clic pour créer l'anneau, glisser (réduire légèrement, donc un tout petit mouvement), 2e clic pour valider. Si le mouvement te semble trop sensible à la souris, ouvre le panneau « Loop Cut and Slide » en bas à gauche et tape une petite valeur dans Factor plutôt qu'à l'œil."],
          en: ["Loop Cut at the bottom inside, reduce slightly (Ctrl/Cmd+R)", "Finalises the bottom's thickness",
               "Same idea, but for the glass's inner bottom. This last cut locks in the bottom's thickness for good, so the final smoothing doesn't make it vanish or get too thin — it's what neatly finishes off the glass's double wall (outer + inner).",
               null,
               "Last application of the same method: 1st click creates the ring, slide it (reduce slightly, so a very small movement), 2nd click to confirm. If the mouse feels too sensitive, open the « Loop Cut and Slide » panel bottom-left and type a small value in Factor instead of eyeballing it."] },
        { fr: ["Sélectionner la face du dessous, Inset deux fois pour l'aplatir (Face mode 3, puis I, I)", "Évite un fond trop arrondi par le Subdivision"],
          en: ["Select the bottom face, Inset twice to flatten it (Face mode 3, then I, I)", "Avoids a bottom that's too rounded by the Subdivision"] },
        { fr: ["Lisser l'objet entier (clic droit > Shade Smooth)", "Dernière touche de finition sur le verre"],
          en: ["Smooth the whole object (right-click > Shade Smooth)", "Final finishing touch on the glass"] }
      ]
    },
    {
      id: "s3", accent: "var(--gold)",
      title: { fr: "Modéliser l'eau", en: "Modelling the water" },
      eyebrow: { fr: "Étape 3", en: "Step 3" },
      items: [
        { fr: ["Ajouter un nouveau cylindre pour l'eau (Shift+A > Mesh > Cylinder)", "Objet séparé du verre"],
          en: ["Add a new cylinder for the water (Shift+A > Mesh > Cylinder)", "Separate object from the glass"] },
        { fr: ["Le remonter au niveau du fond du verre (G, Z)", "Doit reposer sur le fond intérieur"],
          en: ["Move it up to the level of the glass's bottom (G, Z)", "Should rest on the inner bottom"] },
        { fr: ["Le réduire légèrement pour qu'il ne dépasse pas des parois (S)", "Évite que l'eau traverse le verre visuellement"],

    },
    {
      id: "s4", accent: "var(--purple)",
      title: { fr: "Matériaux : verre et eau", en: "Materials: glass and water" },
      eyebrow: { fr: "Étape 4", en: "Step 4" },
      items: [
        { fr: ["Passer dans l'espace Shading", "Onglet en haut de l'écran"],
          en: ["Switch to the Shading workspace", "Tab at the top of the screen"] },
        { fr: ["Sélectionner le verre, cliquer sur New pour créer un matériau", "Panneau Material en bas de l'éditeur de nœuds"],
          en: ["Select the glass, click New to create a material", "Material panel at the bottom of the node editor"] },
        { fr: ["Supprimer le nœud Principled BSDF par défaut", "Sélectionner le nœud puis X ou Delete"],
          en: ["Delete the default Principled BSDF node", "Select the node then X or Delete"] },
        { fr: ["Ajouter un nœud Glass BSDF (Shift+A > Search > « Glass »)", "En français, souvent affiché « Verre BSDF »"],
          en: ["Add a Glass BSDF node (Shift+A > Search > « Glass »)", "In French Blender, often shown as « Verre BSDF »"] },
        { fr: ["Relier sa sortie à l'entrée Surface du Material Output", "Glisser depuis le point de sortie vers le point d'entrée"],
          en: ["Connect its output to the Material Output's Surface input", "Drag from the output socket to the input socket"] },
        { fr: ["Basculer en Rendered pour prévisualiser (4e icône de shading)", "Ça paraîtra bizarre tant qu'il n'y a pas de lumière — normal"],
          en: ["Switch to Rendered to preview (4th shading icon)", "It'll look odd until there's a light — that's normal"] },
        { fr: ["Sélectionner l'eau, New pour un nouveau matériau", "Même panneau Material"],
          en: ["Select the water, New for a new material", "Same Material panel"] },
        { fr: ["Supprimer le Principled BSDF, ajouter un Glass BSDF, relier au Material Output", "Même procédure que pour le verre"],
          en: ["Delete the Principled BSDF, add a Glass BSDF, connect to the Material Output", "Same procedure as for the glass"] },
        { fr: ["Optionnel : changer la couleur du Glass BSDF pour teinter l'eau", "Champ Color du nœud — ex. rose pour de la grenadine"],
          en: ["Optional: change the Glass BSDF's colour to tint the water", "Colour field of the node — e.g. pink for grenadine"] }
      ]
    },
    {
      id: "s5", accent: "var(--teal)",
      title: { fr: "Éclairage, décor et finitions", en: "Lighting, set dressing and finishing touches" },
      eyebrow: { fr: "Étape 5", en: "Step 5" },
      note: { fr: "Après chaque réglage (lumière, moteur de rendu...), vérifie le rendu : icônes de shading en haut à droite (Rendered), ou vue caméra (0 du pavé numérique, Ctrl+Alt+0 pour aligner).",
              en: "After each setting (light, render engine...), check the render: shading icons top-right (Rendered), or camera view (0 on the numpad, Ctrl+Alt+0 to align)." },
      items: [
        { fr: ["Ajouter une lumière Sun (Shift+A > Light > Sun)", "Type de lumière le plus simple à régler"],
          en: ["Add a Sun light (Shift+A > Light > Sun)", "Simplest light type to set up"] },
        { fr: ["Orienter le soleil en le faisant glisser/tourner", "Pour que la lumière vienne d'un côté précis"],
          en: ["Angle the sun by dragging/rotating it", "So the light comes from a specific direction"] },
        { fr: ["Passer le moteur de rendu de Eevee à Cycles", "Render Properties (icône appareil photo) — plus réaliste mais plus lent"],
          en: ["Switch the render engine from Eevee to Cycles", "Render Properties (camera icon) — more realistic but slower"] },
        { fr: ["Ajouter un plan comme sol (Shift+A > Mesh > Plane)", "Le descendre au niveau du verre, puis l'agrandir (S)"],
          en: ["Add a plane as the ground (Shift+A > Mesh > Plane)", "Move it down to the glass's level, then scale it up (S)"] },
        { fr: ["Booster la puissance du soleil", "Sélectionner le Sun > icône ampoule (Light) > augmenter Power"],
          en: ["Boost the sun's power", "Select the Sun > light bulb icon (Light) > increase Power"] },
        { fr: ["Bonus : télécharger une image HDRI avant de commencer", "Va sur polyhaven.com → HDRIs → choisis-en une → résolution 2K ou 4K (pas 16K, trop lourd) → télécharge le fichier .hdr ou .exr"],
          en: ["Bonus: download an HDRI image before starting", "Go to polyhaven.com → HDRIs → pick one → 2K or 4K resolution (not 16K, too heavy) → download the .hdr or .exr file"] },
        { fr: ["Basculer du matériau vers le World (menu déroulant en haut de l'éditeur de nœuds)", "Ce menu affiche le nom de ton matériau (ex. « Verre ») — clique dessus, choisis « World »"],
          en: ["Switch from the material to the World (dropdown at the top of the node editor)", "This dropdown shows your material's name (e.g. « Glass ») — click it, choose « World »"] },
        { fr: ["Vérifier que 2 nœuds « Background » et « World Output » sont visibles", "Différents des nœuds du matériau que tu viens de quitter"],
          en: ["Check that 2 nodes « Background » and « World Output » are visible", "Different from the material nodes you just left"] },
        { fr: ["Ajouter un nœud Environment Texture (Shift+A, taper « Environment » dans la recherche)", "Souris dans l'éditeur de nœuds — clique une fois pour ouvrir Add, une 2e fois pour poser le nœud sur la grille"],
          en: ["Add an Environment Texture node (Shift+A, type « Environment » in the search)", "Mouse in the node editor — click once to open Add, click again to place the node on the grid"] },
        { fr: ["Relier Color (Environment Texture) → Color (Background)", "Clique sur le point à droite de Color, glisse un fil jusqu'au point à gauche de Color sur Background, relâche"],
          en: ["Connect Color (Environment Texture) → Color (Background)", "Click the dot to the right of Color, drag a wire to the dot left of Color on Background, release"] },
        { fr: ["Cliquer sur le bouton « Open » du nœud Environment Texture", "Ouvre l'explorateur de fichiers de Blender"],
          en: ["Click the « Open » button on the Environment Texture node", "Opens Blender's file browser"] },
        { fr: ["Naviguer jusqu'au fichier HDRI téléchargé et double-cliquer dessus", "Ou le sélectionner puis cliquer « Open Image » en haut à droite de l'explorateur"],
          en: ["Browse to the downloaded HDRI file and double-click it", "Or select it then click « Open Image » top-right of the browser"] },
        { fr: ["Optionnel : supprimer le Sun, l'HDRI éclaire déjà la scène", "Sélectionner le Sun, X pour supprimer"],
          en: ["Optional: delete the Sun, the HDRI already lights the scene", "Select the Sun, X to delete"] },
        { fr: ["Si l'eau paraît anguleuse : Shade Smooth, ou Loop Cuts + Inset en Edit Mode", "Le cylindre de l'eau a peu de vertices, moins lissé que le verre par le Subdivision"],
          en: ["If the water looks blocky: Shade Smooth, or Loop Cuts + Inset in Edit Mode", "The water cylinder has few vertices, less smoothed than the glass by the Subdivision"] },
        { fr: ["Réafficher tous les objets si besoin (Alt+H), vérifier le rendu final", "En vue Rendered"],
          en: ["Unhide all objects if needed (Alt+H), check the final render", "In Rendered view"] }
      ]
    }
  ];

  const STORAGE_KEY = "blender-glass-checklist-progress";
  const LANG_KEY = "blender-glass-checklist-progress-lang";
  let state = {};
  let lang = "fr";

  const root = document.getElementById("blender-checklist-root");

  function totalItems() {
    return DATA.reduce((acc, s) => acc + s.items.length, 0);
  }
  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronIcon() {
    return '<svg class="bc-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const t = UI[lang];
    const total = totalItems();
    const done = checkedCount();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = '';
    html += '<div class="bc-hero">';
    html += '  <div class="bc-lang-toggle">';
    html += '    <button class="bc-lang-btn' + (lang === 'fr' ? ' active' : '') + '" data-lang="fr">FR</button>';
    html += '    <button class="bc-lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>';
    html += '  </div>';
    html += '  <p class="bc-eyebrow">' + t.eyebrow + '</p>';
    html += '  <h1 class="bc-title">' + t.title + '</h1>';
    html += '  <p class="bc-sub">' + t.sub + '</p>';
    html += '  <div class="bc-progress-row">';
    html += '    <div class="bc-progress-track"><div class="bc-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div class="bc-progress-label">' + done + ' / ' + total + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="bc-body">';
    DATA.forEach((section) => {
      const sectionDone = section.items.filter((_, i) => state[section.id + '-' + i]).length;
      const isOpen = section._open !== false;
      html += '<div class="bc-section' + (isOpen ? ' open' : '') + '" data-section="' + section.id + '" style="--accent:' + section.accent + '">';
      html += '  <div class="bc-section-head" data-toggle="' + section.id + '">';
      html += '    <div class="bc-section-titlewrap">';
      html += '      <span class="bc-section-eyebrow">' + section.eyebrow[lang] + '</span>';
      html += '      <span class="bc-section-title">' + section.title[lang] + '</span>';
      html += '    </div>';
      html += '    <div class="bc-section-right">';
      html += '      <span class="bc-count">' + sectionDone + '/' + section.items.length + '</span>';
      html += chevronIcon();
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="bc-items">';
      if (section.note) {
        html += '  <div class="bc-note">' + t.noteIcon + ' <span>' + escapeHtml(section.note[lang]) + '</span></div>';
      }
      section.items.forEach((pair, i) => {
        const text = pair[lang][0];
        const hint = pair[lang][1];
        const why = pair[lang][2];
        const warn = pair[lang][3];
        const confirm = pair[lang][4];
        const itemId = section.id + '-' + i;
        const checked = !!state[itemId];
        html += '<div class="bc-item' + (checked ? ' done' : '') + '" data-item="' + itemId + '">';
        html += '  <div class="bc-checkbox' + (checked ? ' checked' : '') + '">' + checkIcon() + '</div>';
        html += '  <div class="bc-item-textwrap">';
        html += '    <div class="bc-item-text">' + escapeHtml(text) + '</div>';
        if (hint) {
          html += '    <div class="bc-item-hint">' + escapeHtml(hint) + '</div>';
        }
        if (why) {
          html += '    <div class="bc-item-why">' + escapeHtml(why) + '</div>';
        }
        if (warn) {
          html += '    <div class="bc-item-warn">' + escapeHtml(warn) + '</div>';
        }
        if (confirm) {
          html += '    <div class="bc-item-confirm">' + escapeHtml(confirm) + '</div>';
        }
        html += '  </div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="bc-footer">';
    html += '  <button class="bc-reset" data-reset="1">' + t.reset + '</button>';
    html += '  <span class="bc-savenote">' + t.saved + '</span>';
    html += '</div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    root.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        const section = DATA.find((s) => s.id === id);
        section._open = section._open === false ? true : false;
        render();
      });
    });
    root.querySelectorAll('[data-item]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-item');
        state[id] = !state[id];
        render();
        persist();
      });
    });
    root.querySelectorAll('[data-lang]').forEach((el) => {
      el.addEventListener('click', () => {
        lang = el.getAttribute('data-lang');
        render();
        persistLang();
      });
    });
    const resetBtn = root.querySelector('[data-reset]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state = {};
        render();
        persist();
      });
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Impossible de sauvegarder la progression', e);
    }
  }

  function persistLang() {
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      console.error('Impossible de sauvegarder la langue', e);
    }
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { state = JSON.parse(saved); }
    } catch (e) {
      state = {};
    }
    try {
      const savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang) { lang = savedLang; }
    } catch (e) {
      lang = "fr";
    }
    render();
  }

  load();
})();
</script>
