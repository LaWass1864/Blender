<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon verre d'eau</title>
</head>
<body style="margin:0; padding:24px 12px; background:#F0EDF7; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<div id="blender-checklist-root"></div>
<style>
  #blender-checklist-root {
    --purple: #5B3A8E;
    --purple-dark: #3B2760;
    --teal: #1F8A87;
    --gold: #C9A227;
    --cream: #FBF9F5;
    --ink: #2B2438;
    --grey: #6E6A78;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    border-radius: 20px;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(43,36,56,0.08);
  }

  .bc-hero {
    background: linear-gradient(135deg, var(--purple-dark), #4A3170);
    color: #fff;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .bc-hero::after {
    content: "";
    position: absolute;
    top: -60px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(201,162,39,0.18);
  }
  .bc-lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    z-index: 2;
  }
  .bc-lang-btn {
    border: none;
    background: transparent;
    color: #D9CFEE;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .bc-lang-btn.active {
    background: var(--gold);
    color: var(--purple-dark);
  }
  .bc-eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
    position: relative;
  }
  .bc-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    position: relative;
    padding-right: 90px;
  }
  .bc-sub {
    font-size: 13px;
    color: #D9CFEE;
    margin: 0 0 20px;
    position: relative;
    max-width: 480px;
  }
  .bc-progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bc-progress-track {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .bc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .bc-progress-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }

  .bc-body { padding: 10px 20px 22px; }

  .bc-section {
    border: 1px solid #E8E2D8;
    background: #fff;
    border-radius: 14px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bc-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    border-left: 5px solid var(--accent, var(--purple));
  }
  .bc-section-head:hover { background: #FBF9F5; }
  .bc-section-titlewrap { display: flex; flex-direction: column; gap: 2px; }
  .bc-section-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent, var(--purple));
  }
  .bc-section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .bc-section-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bc-count {
    font-size: 11.5px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 34px;
    text-align: right;
  }
  .bc-chevron {
    width: 18px; height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--grey);
  }
  .bc-section.open .bc-chevron { transform: rotate(180deg); }

  .bc-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .bc-section.open .bc-items { max-height: 2200px; }

  .bc-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 10px 16px 0;
    padding: 9px 12px;
    background: rgba(31,138,135,0.08);
    border: 1px solid rgba(31,138,135,0.35);
    border-radius: 10px;
    font-size: 11.8px;
    line-height: 1.35;
    color: var(--ink);
  }
  .bc-note strong { color: var(--teal); }
  .bc-note.warn {
    background: rgba(201,162,39,0.1);
    border-color: rgba(201,162,39,0.45);
  }

  .bc-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px 10px 20px;
    border-top: 1px solid #F1EDE3;
  }
  .bc-checkbox {
    margin-top: 2px;
    width: 19px; height: 19px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 2px solid #D7CFE6;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bc-checkbox.checked {
    background: var(--accent, var(--purple));
    border-color: var(--accent, var(--purple));
  }
  .bc-checkbox svg { width: 12px; height: 12px; opacity: 0; }
  .bc-checkbox.checked svg { opacity: 1; }
  .bc-item-textwrap { cursor: pointer; }
  .bc-item-text {
    font-size: 13.3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .bc-item-hint {
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--accent, var(--purple));
    margin-top: 3px;
    opacity: 0.85;
  }
  .bc-item-hint::before {
    content: "📍 ";
  }
  .bc-item.done .bc-item-text {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: #C9BFDD;
  }
  .bc-item.done .bc-item-hint { opacity: 0.4; }

  .bc-footer {
    padding: 4px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bc-reset {
    font-size: 12px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .bc-savenote {
    font-size: 11px;
    color: #A79EC0;
  }
</style>
<script>
(function () {
  const UI = {
    fr: {
      eyebrow: "Pratique personnelle",
      title: "Mon verre d'eau",
      sub: "Coche chaque étape en suivant la transcription complète du tuto. Le 📍 indique où trouver l'outil à l'écran.",
      reset: "Réinitialiser ma progression",
      saved: "Progression sauvegardée automatiquement",
      noteIcon: "🔍"
    },
    en: {
      eyebrow: "Personal practice",
      title: "My glass of water",
      sub: "Check off each step while following the tutorial's full transcript. The 📍 shows you where to find the tool on screen.",
      reset: "Reset my progress",
      saved: "Progress saved automatically",
      noteIcon: "🔍"
    }
  };

  const DATA = [
    {
      id: "s1", accent: "var(--purple)",
      title: { fr: "Modéliser le corps du verre", en: "Modelling the glass body" },
      eyebrow: { fr: "Étape 1", en: "Step 1" },
      items: [
        { fr: ["Tout sélectionner et supprimer la scène par défaut (A puis X)", "Dans le viewport, rien de sélectionné au préalable"],
          en: ["Select all and delete the default scene (A then X)", "In the viewport, with nothing pre-selected"] },
        { fr: ["Ajouter un cylindre (Shift+A > Mesh > Cylinder)", "Point de départ du verre"],
          en: ["Add a cylinder (Shift+A > Mesh > Cylinder)", "Starting point for the glass"] },
        { fr: ["Passer en Edit Mode, sélectionner la face du dessus (Tab, puis Face mode 3)", "Icônes de sélection en haut du viewport"],
          en: ["Switch to Edit Mode, select the top face (Tab, then Face mode 3)", "Selection icons at the top of the viewport"] },
        { fr: ["Étirer la face vers le haut pour donner la hauteur du verre (G, Z)", "À l'œil — pas de valeur exacte, ajuste selon ton goût"],
          en: ["Stretch the face upward to set the glass's height (G, Z)", "By eye — no exact value, adjust to taste"] },
        { fr: ["Insérer une face pour définir l'épaisseur de la paroi (I)", "Toujours sur la face du dessus sélectionnée"],
          en: ["Inset a face to define the wall thickness (I)", "Still on the selected top face"] },
        { fr: ["Creuser l'intérieur en extrudant vers le bas (E, puis déplacer/scroller vers le bas)", "Ne pas dépasser le fond extérieur du verre"],
          en: ["Hollow out the inside by extruding downward (E, then move/scroll down)", "Don't go past the outer bottom of the glass"] },
        { fr: ["Ajuster la hauteur du fond intérieur (G, Z)", "Astuce : Alt+Z affiche en rayons X pour voir à travers et bien se positionner"],
          en: ["Adjust the height of the inner bottom (G, Z)", "Tip: Alt+Z shows X-ray mode to see through and position accurately"] },
        { fr: ["Ajuster l'épaisseur du fond (G, Z sur les points intérieurs)", "Laisse un petit fond de verre, pas trop fin"],
          en: ["Adjust the bottom's thickness (G, Z on the inner points)", "Leave a small glass floor, not too thin"] }
      ]
    },
    {
      id: "s2", accent: "var(--teal)",
      title: { fr: "Lisser et affiner la forme", en: "Smoothing and refining the shape" },
      eyebrow: { fr: "Étape 2", en: "Step 2" },
      note: { fr: "Après le Subdivision, vérifie le rendu : icônes de shading en haut à droite du viewport (Solid → Material Preview), ou vue caméra (0 du pavé numérique).",
              en: "After the Subdivision, check the result: shading icons top-right of the viewport (Solid → Material Preview), or camera view (0 on the numpad)." },
      items: [
        { fr: ["Retourner en Object Mode (Tab)", "Pour accéder aux modifiers"],
          en: ["Go back to Object Mode (Tab)", "To access the modifiers"] },
        { fr: ["Ajouter le modifier Subdivision Surface (icône clé à molette > Add Modifier)", "Lisse l'objet en ajoutant des faces"],
          en: ["Add the Subdivision Surface modifier (wrench icon > Add Modifier)", "Smooths the object by adding faces"] },
        { fr: ["Augmenter le niveau du Subdivision Surface à 3", "Champ Levels Viewport dans le modifier"],
          en: ["Increase the Subdivision Surface level to 3", "Levels Viewport field in the modifier"] },
        { fr: ["Repasser en Edit Mode, face intérieure sélectionnée : Inset deux fois (I, I)", "Arrondit le bord du verre"],
          en: ["Switch back to Edit Mode, inner face selected: Inset twice (I, I)", "Rounds off the rim of the glass"] },
        { fr: ["Loop Cut sur les arêtes verticales, glisser vers le bas pour aplatir la base (Ctrl/Cmd+R)", "Réduit l'effet trop sphérique du Subdivision en dessous"],
          en: ["Loop Cut on the vertical edges, slide down to flatten the base (Ctrl/Cmd+R)", "Reduces the overly spherical effect of the Subdivision underneath"] },
        { fr: ["Loop Cut près du haut, glisser vers le haut (Ctrl/Cmd+R)", "Même geste, côté opposé"],
          en: ["Loop Cut near the top, slide up (Ctrl/Cmd+R)", "Same gesture, opposite side"] },
        { fr: ["Loop Cut à l'intérieur, glisser vers le haut pour l'épaisseur (Ctrl/Cmd+R)", "Sur les arêtes intérieures du verre"],
          en: ["Loop Cut on the inside, slide up for thickness (Ctrl/Cmd+R)", "On the glass's inner edges"] },
        { fr: ["Loop Cut en bas à l'intérieur, réduire légèrement (Ctrl/Cmd+R)", "Finalise l'épaisseur du fond"],
          en: ["Loop Cut at the bottom inside, reduce slightly (Ctrl/Cmd+R)", "Finalises the bottom's thickness"] },
        { fr: ["Sélectionner la face du dessous, Inset deux fois pour l'aplatir (Face mode 3, puis I, I)", "Évite un fond trop arrondi par le Subdivision"],
          en: ["Select the bottom face, Inset twice to flatten it (Face mode 3, then I, I)", "Avoids a bottom that's too rounded by the Subdivision"] },
        { fr: ["Lisser l'objet entier (clic droit > Shade Smooth)", "Dernière touche de finition sur le verre"],
          en: ["Smooth the whole object (right-click > Shade Smooth)", "Final finishing touch on the glass"] }
      ]
    },
    {
      id: "s3", accent: "var(--gold)",
      title: { fr: "Modéliser l'eau", en: "Modelling the water" },
      eyebrow: { fr: "Étape 3", en: "Step 3" },
      items: [
        { fr: ["Ajouter un nouveau cylindre pour l'eau (Shift+A > Mesh > Cylinder)", "Objet séparé du verre"],
          en: ["Add a new cylinder for the water (Shift+A > Mesh > Cylinder)", "Separate object from the glass"] },
        { fr: ["Le remonter au niveau du fond du verre (G, Z)", "Doit reposer sur le fond intérieur"],
          en: ["Move it up to the level of the glass's bottom (G, Z)", "Should rest on the inner bottom"] },
        { fr: ["Le réduire légèrement pour qu'il ne dépasse pas des parois (S)", "Évite que l'eau traverse le verre visuellement"],
          en: ["Scale it down slightly so it doesn't poke through the walls (S)", "Avoids the water visually clipping through the glass"] },
        { fr: ["Ajuster le niveau de l'eau (sélectionner la face du dessus, G, Z)", "À quelle hauteur tu veux remplir le verre"],
          en: ["Adjust the water level (select the top face, G, Z)", "How high you want to fill the glass"] }
      ]
    },
    {
      id: "s4", accent: "var(--purple)",
      title: { fr: "Matériaux : verre et eau", en: "Materials: glass and water" },
      eyebrow: { fr: "Étape 4", en: "Step 4" },
      items: [
        { fr: ["Passer dans l'espace Shading", "Onglet en haut de l'écran"],
          en: ["Switch to the Shading workspace", "Tab at the top of the screen"] },
        { fr: ["Sélectionner le verre, cliquer sur New pour créer un matériau", "Panneau Material en bas de l'éditeur de nœuds"],
          en: ["Select the glass, click New to create a material", "Material panel at the bottom of the node editor"] },
        { fr: ["Supprimer le nœud Principled BSDF par défaut", "Sélectionner le nœud puis X ou Delete"],
          en: ["Delete the default Principled BSDF node", "Select the node then X or Delete"] },
        { fr: ["Ajouter un nœud Glass BSDF (Shift+A > Search > « Glass »)", "En français, souvent affiché « Verre BSDF »"],
          en: ["Add a Glass BSDF node (Shift+A > Search > « Glass »)", "In French Blender, often shown as « Verre BSDF »"] },
        { fr: ["Relier sa sortie à l'entrée Surface du Material Output", "Glisser depuis le point de sortie vers le point d'entrée"],
          en: ["Connect its output to the Material Output's Surface input", "Drag from the output socket to the input socket"] },
        { fr: ["Basculer en Rendered pour prévisualiser (4e icône de shading)", "Ça paraîtra bizarre tant qu'il n'y a pas de lumière — normal"],
          en: ["Switch to Rendered to preview (4th shading icon)", "It'll look odd until there's a light — that's normal"] },
        { fr: ["Sélectionner l'eau, New pour un nouveau matériau", "Même panneau Material"],
          en: ["Select the water, New for a new material", "Same Material panel"] },
        { fr: ["Supprimer le Principled BSDF, ajouter un Glass BSDF, relier au Material Output", "Même procédure que pour le verre"],
          en: ["Delete the Principled BSDF, add a Glass BSDF, connect to the Material Output", "Same procedure as for the glass"] },
        { fr: ["Optionnel : changer la couleur du Glass BSDF pour teinter l'eau", "Champ Color du nœud — ex. rose pour de la grenadine"],
          en: ["Optional: change the Glass BSDF's colour to tint the water", "Colour field of the node — e.g. pink for grenadine"] }
      ]
    },
    {
      id: "s5", accent: "var(--teal)",
      title: { fr: "Éclairage, décor et finitions", en: "Lighting, set dressing and finishing touches" },
      eyebrow: { fr: "Étape 5", en: "Step 5" },
      note: { fr: "Après chaque réglage (lumière, moteur de rendu...), vérifie le rendu : icônes de shading en haut à droite (Rendered), ou vue caméra (0 du pavé numérique, Ctrl+Alt+0 pour aligner).",
              en: "After each setting (light, render engine...), check the render: shading icons top-right (Rendered), or camera view (0 on the numpad, Ctrl+Alt+0 to align)." },
      items: [
        { fr: ["Ajouter une lumière Sun (Shift+A > Light > Sun)", "Type de lumière le plus simple à régler"],
          en: ["Add a Sun light (Shift+A > Light > Sun)", "Simplest light type to set up"] },
        { fr: ["Orienter le soleil en le faisant glisser/tourner", "Pour que la lumière vienne d'un côté précis"],
          en: ["Angle the sun by dragging/rotating it", "So the light comes from a specific direction"] },
        { fr: ["Passer le moteur de rendu de Eevee à Cycles", "Render Properties (icône appareil photo) — plus réaliste mais plus lent"],
          en: ["Switch the render engine from Eevee to Cycles", "Render Properties (camera icon) — more realistic but slower"] },
        { fr: ["Ajouter un plan comme sol (Shift+A > Mesh > Plane)", "Le descendre au niveau du verre, puis l'agrandir (S)"],
          en: ["Add a plane as the ground (Shift+A > Mesh > Plane)", "Move it down to the glass's level, then scale it up (S)"] },
        { fr: ["Booster la puissance du soleil", "Sélectionner le Sun > icône ampoule (Light) > augmenter Power"],
          en: ["Boost the sun's power", "Select the Sun > light bulb icon (Light) > increase Power"] },
        { fr: ["Bonus : ajouter un environnement HDRI (menu déroulant du haut → World)", "Dans l'espace Shading, en haut du panneau de nœuds"],
          en: ["Bonus: add an HDRI environment (top dropdown → World)", "In the Shading workspace, at the top of the node panel"] },
        { fr: ["Ajouter un nœud Environment Texture, relier à Color du Background (Shift+A > Search)", "Puis cliquer sur Open pour charger une image HDRI"],
          en: ["Add an Environment Texture node, connect to the Background's Color (Shift+A > Search)", "Then click Open to load an HDRI image"] },
        { fr: ["Où trouver des HDRI gratuites ?", "Poly Haven, par exemple — images 360° téléchargeables gratuitement"],
          en: ["Where to find free HDRIs?", "Poly Haven, for example — free downloadable 360° images"] },
        { fr: ["Optionnel : supprimer le Sun, l'HDRI éclaire déjà la scène", "Sélectionner le Sun, X pour supprimer"],
          en: ["Optional: delete the Sun, the HDRI already lights the scene", "Select the Sun, X to delete"] },
        { fr: ["Si l'eau paraît anguleuse : Shade Smooth, ou Loop Cuts + Inset en Edit Mode", "Le cylindre de l'eau a peu de vertices, moins lissé que le verre par le Subdivision"],
          en: ["If the water looks blocky: Shade Smooth, or Loop Cuts + Inset in Edit Mode", "The water cylinder has few vertices, less smoothed than the glass by the Subdivision"] },
        { fr: ["Réafficher tous les objets si besoin (Alt+H), vérifier le rendu final", "En vue Rendered"],
          en: ["Unhide all objects if needed (Alt+H), check the final render", "In Rendered view"] }
      ]
    }
  ];

  const STORAGE_KEY = "blender-glass-checklist-progress";
  const LANG_KEY = "blender-glass-checklist-progress-lang";
  let state = {};
  let lang = "fr";

  const root = document.getElementById("blender-checklist-root");

  function totalItems() {
    return DATA.reduce((acc, s) => acc + s.items.length, 0);
  }
  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronIcon() {
    return '<svg class="bc-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const t = UI[lang];
    const total = totalItems();
    const done = checkedCount();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = '';
    html += '<div class="bc-hero">';
    html += '  <div class="bc-lang-toggle">';
    html += '    <button class="bc-lang-btn' + (lang === 'fr' ? ' active' : '') + '" data-lang="fr">FR</button>';
    html += '    <button class="bc-lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>';
    html += '  </div>';
    html += '  <p class="bc-eyebrow">' + t.eyebrow + '</p>';
    html += '  <h1 class="bc-title">' + t.title + '</h1>';
    html += '  <p class="bc-sub">' + t.sub + '</p>';
    html += '  <div class="bc-progress-row">';
    html += '    <div class="bc-progress-track"><div class="bc-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div class="bc-progress-label">' + done + ' / ' + total + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="bc-body">';
    DATA.forEach((section) => {
      const sectionDone = section.items.filter((_, i) => state[section.id + '-' + i]).length;
      const isOpen = section._open !== false;
      html += '<div class="bc-section' + (isOpen ? ' open' : '') + '" data-section="' + section.id + '" style="--accent:' + section.accent + '">';
      html += '  <div class="bc-section-head" data-toggle="' + section.id + '">';
      html += '    <div class="bc-section-titlewrap">';
      html += '      <span class="bc-section-eyebrow">' + section.eyebrow[lang] + '</span>';
      html += '      <span class="bc-section-title">' + section.title[lang] + '</span>';
      html += '    </div>';
      html += '    <div class="bc-section-right">';
      html += '      <span class="bc-count">' + sectionDone + '/' + section.items.length + '</span>';
      html += chevronIcon();
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="bc-items">';
      if (section.note) {
        html += '  <div class="bc-note">' + t.noteIcon + ' <span>' + escapeHtml(section.note[lang]) + '</span></div>';
      }
      section.items.forEach((pair, i) => {
        const text = pair[lang][0];
        const hint = pair[lang][1];
        const itemId = section.id + '-' + i;
        const checked = !!state[itemId];
        html += '<div class="bc-item' + (checked ? ' done' : '') + '" data-item="' + itemId + '">';
        html += '  <div class="bc-checkbox' + (checked ? ' checked' : '') + '">' + checkIcon() + '</div>';
        html += '  <div class="bc-item-textwrap">';
        html += '    <div class="bc-item-text">' + escapeHtml(text) + '</div>';
        if (hint) {
          html += '    <div class="bc-item-hint">' + escapeHtml(hint) + '</div>';
        }
        html += '  </div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="bc-footer">';
    html += '  <button class="bc-reset" data-reset="1">' + t.reset + '</button>';
    html += '  <span class="bc-savenote">' + t.saved + '</span>';
    html += '</div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    root.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        const section = DATA.find((s) => s.id === id);
        section._open = section._open === false ? true : false;
        render();
      });
    });
    root.querySelectorAll('[data-item]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-item');
        state[id] = !state[id];
        render();
        persist();
      });
    });
    root.querySelectorAll('[data-lang]').forEach((el) => {
      el.addEventListener('click', () => {
        lang = el.getAttribute('data-lang');
        render();
        persistLang();
      });
    });
    const resetBtn = root.querySelector('[data-reset]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state = {};
        render();
        persist();
      });
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Impossible de sauvegarder la progression', e);
    }
  }

  function persistLang() {
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      console.error('Impossible de sauvegarder la langue', e);
    }
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { state = JSON.parse(saved); }
    } catch (e) {
      state = {};
    }
    try {
      const savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang) { lang = savedLang; }
    } catch (e) {
      lang = "fr";
    }
    render();
  }

  load();
})();
</script>

</body>
</html>
