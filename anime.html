<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon petit personnage</title>
</head>
<body style="margin:0; padding:24px 12px; background:#F0EDF7; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<div id="blender-checklist-root"></div>
<style>
  #blender-checklist-root {
    --purple: #5B3A8E;
    --purple-dark: #3B2760;
    --teal: #1F8A87;
    --gold: #C9A227;
    --cream: #FBF9F5;
    --ink: #2B2438;
    --grey: #6E6A78;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    border-radius: 20px;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(43,36,56,0.08);
  }

  .bc-hero {
    background: linear-gradient(135deg, var(--purple-dark), #4A3170);
    color: #fff;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .bc-hero::after {
    content: "";
    position: absolute;
    top: -60px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(201,162,39,0.18);
  }
  .bc-lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    z-index: 2;
  }
  .bc-lang-btn {
    border: none;
    background: transparent;
    color: #D9CFEE;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .bc-lang-btn.active {
    background: var(--gold);
    color: var(--purple-dark);
  }
  .bc-eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
    position: relative;
  }
  .bc-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    position: relative;
    padding-right: 90px;
  }
  .bc-sub {
    font-size: 13px;
    color: #D9CFEE;
    margin: 0 0 20px;
    position: relative;
    max-width: 480px;
  }
  .bc-progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bc-progress-track {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .bc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .bc-progress-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }

  .bc-body { padding: 10px 20px 22px; }

  .bc-visual {
    background: #fff;
    border: 1px solid #E8E2D8;
    border-radius: 14px;
    margin: 16px 20px 0;
    padding: 12px 8px 6px;
  }
  .bc-visual-caption {
    text-align: center;
    font-size: 11.5px;
    color: var(--grey);
    margin: 2px 0 6px;
  }

  .bc-section {
    border: 1px solid #E8E2D8;
    background: #fff;
    border-radius: 14px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bc-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    border-left: 5px solid var(--accent, var(--purple));
  }
  .bc-section-head:hover { background: #FBF9F5; }
  .bc-section-titlewrap { display: flex; flex-direction: column; gap: 2px; }
  .bc-section-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent, var(--purple));
  }
  .bc-section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .bc-section-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bc-count {
    font-size: 11.5px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 34px;
    text-align: right;
  }
  .bc-chevron {
    width: 18px; height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--grey);
  }
  .bc-section.open .bc-chevron { transform: rotate(180deg); }

  .bc-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .bc-section.open .bc-items { max-height: 3400px; }

  .bc-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 10px 16px 0;
    padding: 9px 12px;
    background: rgba(31,138,135,0.08);
    border: 1px solid rgba(31,138,135,0.35);
    border-radius: 10px;
    font-size: 11.8px;
    line-height: 1.35;
    color: var(--ink);
  }
  .bc-note strong { color: var(--teal); }
  .bc-note.warn {
    background: rgba(201,162,39,0.1);
    border-color: rgba(201,162,39,0.45);
  }

  .bc-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px 10px 20px;
    border-top: 1px solid #F1EDE3;
  }
  .bc-checkbox {
    margin-top: 2px;
    width: 19px; height: 19px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 2px solid #D7CFE6;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bc-checkbox.checked {
    background: var(--accent, var(--purple));
    border-color: var(--accent, var(--purple));
  }
  .bc-checkbox svg { width: 12px; height: 12px; opacity: 0; }
  .bc-checkbox.checked svg { opacity: 1; }
  .bc-item-textwrap { cursor: pointer; }
  .bc-item-text {
    font-size: 13.3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .bc-item-hint {
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--accent, var(--purple));
    margin-top: 3px;
    opacity: 0.85;
  }
  .bc-item-hint::before {
    content: "📍 ";
  }
  .bc-item.done .bc-item-text {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: #C9BFDD;
  }
  .bc-item.done .bc-item-hint { opacity: 0.4; }

  .bc-footer {
    padding: 4px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bc-reset {
    font-size: 12px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .bc-savenote {
    font-size: 11px;
    color: #A79EC0;
  }
</style>
<script>
(function () {
  const UI = {
    fr: {
      eyebrow: "Pratique personnelle",
      title: "Mon petit personnage",
      sub: "Coche chaque étape, du corps de base jusqu'au rendu final. Le 📍 indique où trouver l'outil à l'écran.",
      reset: "Réinitialiser ma progression",
      saved: "Progression sauvegardée automatiquement",
      noteIcon: "🔍"
    },
    en: {
      eyebrow: "Personal practice",
      title: "My little character",
      sub: "Check off each step, from the basic body through to the final render. The 📍 shows you where to find the tool on screen.",
      reset: "Reset my progress",
      saved: "Progress saved automatically",
      noteIcon: "🔍"
    }
  };

  const DATA = [
    {
      id: "s1", accent: "var(--gold)",
      title: { fr: "Préparer la scène", en: "Preparing the scene" },
      eyebrow: { fr: "Étape 1", en: "Step 1" },
      note: { fr: "On construit tout le personnage légèrement décalé du centre : c'est ce qui permettra au Mirror modifier de créer automatiquement le côté symétrique plus tard.",
              en: "We build the whole character slightly off-centre: that's what will let the Mirror modifier automatically generate the symmetric side later." },
      items: [
        { fr: ["Nettoyer la scène si besoin (X sur le cube par défaut, puis « Delete »)", "Clic gauche sur le cube pour le sélectionner (contour orange), puis X, clic sur Delete dans le petit menu"],
          en: ["Clear the scene if needed (X on the default cube, then « Delete »)", "Left-click the cube to select it (orange outline), then X, click Delete in the small menu"] },
        { fr: ["Passer en vue de face (touche 1 du pavé numérique)", "Aide à juger les proportions bien à plat pendant la construction, et à repérer l'axe central (ligne verticale)"],
          en: ["Switch to front view (numpad key 1)", "Helps judge proportions flat-on while building, and spot the central axis (vertical line)"] },
        { fr: ["Activer la vue en transparence si besoin (Alt+Z)", "Utile pour voir à travers les pièces quand elles se chevauchent (bras devant le buste, par exemple)"],
          en: ["Turn on X-ray view if needed (Alt+Z)", "Useful to see through pieces when they overlap (e.g. an arm in front of the torso)"] }
      ]
    },
    {
      id: "s2", accent: "var(--teal)",
      title: { fr: "Le corps et la tête", en: "The body and head" },
      eyebrow: { fr: "Étape 2", en: "Step 2" },
      items: [
        { fr: ["Ajouter un cylindre pour le buste (Shift+A > Mesh > Cylinder)", "Souris dans le viewport, Shift+A ouvre le menu au niveau du curseur — survoler « Mesh » puis cliquer « Cylinder »"],
          en: ["Add a cylinder for the torso (Shift+A > Mesh > Cylinder)", "Mouse in the viewport, Shift+A opens the menu at the cursor — hover « Mesh » then click « Cylinder »"] },
        { fr: ["Affiner le buste (S, taper une valeur ex. 0.4, Entrée)", "S seul redimensionne dans toutes les directions à la fois — pratique pour un buste plus fin qu'un cylindre par défaut"],
          en: ["Slim down the torso (S, type a value e.g. 0.4, Enter)", "S alone scales in every direction at once — handy for a slimmer torso than the default cylinder"] },
        { fr: ["Étirer le buste en hauteur (S puis Z, bouger la souris)", "Z juste après S bloque l'étirement à l'axe vertical uniquement — vise une forme plus haute que large"],
          en: ["Stretch the torso taller (S then Z, move the mouse)", "Z right after S locks the stretch to the vertical axis only — aim for a shape taller than it is wide"] },
        { fr: ["Ajouter une sphère pour la tête (Shift+A > Mesh > UV Sphere)", "Elle apparaît au niveau du curseur 3D, souvent au centre de la scène"],
          en: ["Add a sphere for the head (Shift+A > Mesh > UV Sphere)", "It appears at the 3D cursor, often at the centre of the scene"] },
        { fr: ["Réduire la taille de la tête (S, bouger la souris ou taper une valeur)", "Vise une taille cohérente avec le buste — pas plus grosse qu'un tiers du buste pour un style low-poly équilibré"],
          en: ["Scale down the head (S, move the mouse or type a value)", "Aim for a size consistent with the torso — no bigger than a third of the torso for a balanced low-poly style"] },
        { fr: ["Remonter la tête au-dessus du buste (G puis Z)", "Z juste après G bloque le déplacement à la verticale — pose la tête juste au-dessus du sommet du buste, avec un léger chevauchement pour éviter un trou visible"],
          en: ["Move the head up above the torso (G then Z)", "Z right after G locks the move to vertical — place the head just above the torso's top, with slight overlap to avoid a visible gap"] }
      ]
    },
    {
      id: "s3", accent: "var(--purple)",
      title: { fr: "Bras et jambe, avec symétrie", en: "Arm and leg, with symmetry" },
      eyebrow: { fr: "Étape 3", en: "Step 3" },
      note: { fr: "On ne construit qu'un seul bras et une seule jambe : le Mirror modifier créera automatiquement leur double de l'autre côté.",
              en: "We only build one arm and one leg: the Mirror modifier will automatically create their duplicate on the other side." },
      items: [
        { fr: ["Ajouter un cylindre pour le bras (Shift+A > Mesh > Cylinder)", "Nouvel objet séparé du buste"],
          en: ["Add a cylinder for the arm (Shift+A > Mesh > Cylinder)", "New object, separate from the torso"] },
        { fr: ["Affiner le bras (S, taper une petite valeur ex. 0.15)", "Un bras doit rester nettement plus fin que le buste"],
          en: ["Slim down the arm (S, type a small value e.g. 0.15)", "An arm should stay noticeably thinner than the torso"] },
        { fr: ["Étirer le bras en longueur (S puis Z)", "Vise une longueur qui descend à peu près jusqu'à mi-cuisse une fois positionné"],
          en: ["Stretch the arm to length (S then Z)", "Aim for a length that reaches roughly mid-thigh once positioned"] },
        { fr: ["Décaler le bras sur le côté du buste (G puis X)", "Important : il doit être clairement décalé du centre (pas à X=0), sinon le Mirror n'aura rien à dupliquer de l'autre côté"],
          en: ["Move the arm to the side of the torso (G then X)", "Important: it must be clearly off-centre (not at X=0), otherwise the Mirror has nothing to duplicate on the other side"] },
        { fr: ["Ajuster la hauteur du bras (G puis Z)", "Positionne-le à hauteur d'épaule, contre le buste"],
          en: ["Adjust the arm's height (G then Z)", "Position it at shoulder height, against the torso"] },
        { fr: ["Incliner légèrement le bras si besoin (R puis un axe)", "R puis Y ou X selon l'orientation de ta vue — optionnel, pour une pose plus naturelle"],
          en: ["Angle the arm slightly if you like (R then an axis)", "R then Y or X depending on your view's orientation — optional, for a more natural pose"] },
        { fr: ["Dupliquer le bras pour créer la jambe (Maj+D)", "Crée une copie exacte au même endroit, qui suit encore la souris"],
          en: ["Duplicate the arm to create the leg (Shift+D)", "Creates an exact copy in the same spot, still following the mouse"] },
        { fr: ["Descendre cette copie sous le buste (clic droit pour annuler le suivi de souris, puis G, Z)", "Le clic droit juste après Maj+D laisse la copie sur place — ensuite on la déplace nous-mêmes"],
          en: ["Move that copy below the torso (right-click to cancel the mouse-follow, then G, Z)", "Right-clicking right after Shift+D leaves the copy in place — then you move it yourself"] },
        { fr: ["Redresser la jambe à la verticale (R puis un axe, taper 0)", "Remet l'inclinaison héritée du bras à zéro, pour une jambe bien droite"],
          en: ["Straighten the leg vertically (R then an axis, type 0)", "Resets the tilt inherited from the arm back to zero, for a properly straight leg"] },
        { fr: ["Sélectionner le bras (ou la jambe), ouvrir l'onglet Modifiers", "Icône clé à molette bleue dans le panneau Propriétés à droite, au-dessus de l'icône « a » verte utilisée pour le texte"],
          en: ["Select the arm (or leg), open the Modifiers tab", "Blue wrench icon in the Properties panel on the right, above the green « a » icon used for text"] },
        { fr: ["Ajouter le modifier Mirror", "Bouton « Add Modifier » → catégorie « Generate » → « Mirror »"],
          en: ["Add the Mirror modifier", "« Add Modifier » button → « Generate » category → « Mirror »"] },
        { fr: ["Vérifier que l'axe X est bien coché dans les réglages du modifier", "Une copie miroir doit apparaître automatiquement de l'autre côté du buste"],
          en: ["Check that the X axis is enabled in the modifier's settings", "A mirrored copy should automatically appear on the other side of the torso"] },
        { fr: ["Si la copie n'est pas alignée sur le buste : régler le Mirror Object", "Dans les réglages du modifier, section « Mirror Object » → clique dans le champ et sélectionne le buste — le Mirror utilisera son centre comme axe de symétrie"],
          en: ["If the copy isn't aligned with the torso: set the Mirror Object", "In the modifier's settings, « Mirror Object » field → click it and select the torso — the Mirror will use its centre as the symmetry axis"] },
        { fr: ["Répéter Add Modifier > Mirror sur la jambe si ce n'est pas déjà fait", "Chaque pièce a besoin de son propre modifier Mirror, même si elles partagent le même axe de symétrie"],
          en: ["Repeat Add Modifier > Mirror on the leg if not already done", "Each piece needs its own Mirror modifier, even though they share the same symmetry axis"] }
      ]
    },
    {
      id: "s4", accent: "var(--teal)",
      title: { fr: "Assembler et finir", en: "Assembling and finishing" },
      eyebrow: { fr: "Étape 4", en: "Step 4" },
      items: [
        { fr: ["Sélectionner toutes les pièces (clic + Maj+clic sur chacune)", "Buste, tête, bras, jambe — les contours orange s'additionnent à chaque Maj+clic"],
          en: ["Select all the pieces (click + Shift+click on each)", "Torso, head, arm, leg — orange outlines add up with each Shift+click"] },
        { fr: ["Fusionner en un seul objet (Ctrl+J)", "Elles deviennent un seul objet « Personnage », qui bouge désormais d'un bloc — les modifiers Mirror restent actifs"],
          en: ["Merge into a single object (Ctrl+J)", "They become one « Character » object, moving as a block from now on — the Mirror modifiers stay active"] },
        { fr: ["Appliquer Shade Smooth ou Shade Flat selon le style voulu", "Clic droit sur l'objet → Shade Smooth pour un rendu doux, ou Shade Flat pour garder l'esprit low-poly anguleux"],
          en: ["Apply Shade Smooth or Shade Flat depending on the look you want", "Right-click the object → Shade Smooth for a soft render, or Shade Flat to keep the angular low-poly look"] },
        { fr: ["Ajouter un matériau au personnage", "Panneau Propriétés à droite → icône ronde à damier (Material Properties) → « New » → régler Base Color"],
          en: ["Add a material to the character", "Properties panel on the right → round checkered icon (Material Properties) → « New » → set Base Color"] },
        { fr: ["Optionnel : ajouter des yeux (2 petites UV Sphere)", "Shift+A > Mesh > UV Sphere, réduire fortement (S), positionner sur la tête, matériau sombre distinct"],
          en: ["Optional: add eyes (2 small UV Spheres)", "Shift+A > Mesh > UV Sphere, scale down a lot (S), position on the head, separate dark material"] },
        { fr: ["Ajouter une lumière et une caméra si besoin", "Shift+A > Light > Point ou Area pour la lumière, Shift+A > Camera pour la caméra"],
          en: ["Add a light and a camera if needed", "Shift+A > Light > Point or Area for lighting, Shift+A > Camera for the camera"] },
        { fr: ["Passer en aperçu Matériau pour vérifier le rendu", "4 petites icônes en haut à droite du viewport — cliquer sur la 3e (dégradée)"],
          en: ["Switch to Material Preview to check the render", "4 small icons top-right of the viewport — click the 3rd one (shaded)"] },
        { fr: ["Sauvegarder le fichier (Cmd/Ctrl+S)", "Choisir un nom et un emplacement au premier enregistrement"],
          en: ["Save the file (Cmd/Ctrl+S)", "Choose a name and location on first save"] },
        { fr: ["Lancer le rendu final (F12)", "Ou en haut de l'écran : « Render » → « Render Image »"],
          en: ["Launch the final render (F12)", "Or at the top of the screen: « Render » → « Render Image »"] }
      ]
    }
  ];

  const STORAGE_KEY = "blender-character-checklist-progress";
  const LANG_KEY = "blender-character-checklist-progress-lang";
  let state = {};
  let lang = "fr";

  const root = document.getElementById("blender-checklist-root");

  function totalItems() {
    return DATA.reduce((acc, s) => acc + s.items.length, 0);
  }
  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronIcon() {
    return '<svg class="bc-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const t = UI[lang];
    const total = totalItems();
    const done = checkedCount();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = '';
    html += '<div class="bc-hero">';
    html += '  <div class="bc-lang-toggle">';
    html += '    <button class="bc-lang-btn' + (lang === 'fr' ? ' active' : '') + '" data-lang="fr">FR</button>';
    html += '    <button class="bc-lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>';
    html += '  </div>';
    html += '  <p class="bc-eyebrow">' + t.eyebrow + '</p>';
    html += '  <h1 class="bc-title">' + t.title + '</h1>';
    html += '  <p class="bc-sub">' + t.sub + '</p>';
    html += '  <div class="bc-progress-row">';
    html += '    <div class="bc-progress-track"><div class="bc-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div class="bc-progress-label">' + done + ' / ' + total + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="bc-visual">';
    html += '<svg width="100%" viewBox="0 0 680 460" role="img" aria-label="Silhouette de référence du personnage low-poly">';
    html += '<line x1="340" y1="30" x2="340" y2="420" stroke="var(--grey)" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3"/>';
    html += '<circle cx="340" cy="95" r="42" fill="var(--teal)"/>';
    html += '<circle cx="325" cy="88" r="4" fill="var(--ink)"/>';
    html += '<circle cx="355" cy="88" r="4" fill="var(--ink)"/>';
    html += '<rect x="292" y="138" width="96" height="130" rx="22" fill="var(--purple)"/>';
    html += '<rect x="246" y="150" width="26" height="105" rx="13" fill="var(--grey)" transform="rotate(6 259 150)"/>';
    html += '<rect x="408" y="150" width="26" height="105" rx="13" fill="var(--grey)" transform="rotate(-6 421 150)"/>';
    html += '<rect x="302" y="262" width="30" height="115" rx="14" fill="var(--grey)"/>';
    html += '<rect x="348" y="262" width="30" height="115" rx="14" fill="var(--grey)"/>';
    html += '<line x1="382" y1="80" x2="470" y2="60" stroke="var(--grey)" stroke-width="0.5" stroke-dasharray="2 2"/>';
    html += '<circle cx="382" cy="80" r="2" fill="var(--grey)"/>';
    html += '<text x="476" y="64" font-size="13" font-weight="700" fill="var(--ink)">Tête</text>';
    html += '<text x="476" y="80" font-size="11" fill="var(--grey)">UV Sphere</text>';
    html += '<line x1="388" y1="200" x2="470" y2="170" stroke="var(--grey)" stroke-width="0.5" stroke-dasharray="2 2"/>';
    html += '<circle cx="388" cy="200" r="2" fill="var(--grey)"/>';
    html += '<text x="476" y="174" font-size="13" font-weight="700" fill="var(--ink)">Buste</text>';
    html += '<text x="476" y="190" font-size="11" fill="var(--grey)">Cylindre étiré</text>';
    html += '<line x1="425" y1="200" x2="470" y2="280" stroke="var(--grey)" stroke-width="0.5" stroke-dasharray="2 2"/>';
    html += '<circle cx="425" cy="200" r="2" fill="var(--grey)"/>';
    html += '<text x="476" y="284" font-size="13" font-weight="700" fill="var(--ink)">Bras</text>';
    html += '<text x="476" y="300" font-size="11" fill="var(--grey)">Dupliqué par Mirror</text>';
    html += '<line x1="365" y1="320" x2="470" y2="390" stroke="var(--grey)" stroke-width="0.5" stroke-dasharray="2 2"/>';
    html += '<circle cx="365" cy="320" r="2" fill="var(--grey)"/>';
    html += '<text x="476" y="394" font-size="13" font-weight="700" fill="var(--ink)">Jambe</text>';
    html += '<text x="476" y="410" font-size="11" fill="var(--grey)">Dupliquée par Mirror</text>';
    html += '</svg>';
    html += '<p class="bc-visual-caption">' + (lang === 'fr' ? 'Vue de face — seul le côté droit est modélisé, le gauche vient du Mirror modifier' : 'Front view — only the right side is modelled, the left comes from the Mirror modifier') + '</p>';
    html += '</div>';

    html += '<div class="bc-body">';
    DATA.forEach((section) => {
      const sectionDone = section.items.filter((_, i) => state[section.id + '-' + i]).length;
      const isOpen = section._open !== false;
      html += '<div class="bc-section' + (isOpen ? ' open' : '') + '" data-section="' + section.id + '" style="--accent:' + section.accent + '">';
      html += '  <div class="bc-section-head" data-toggle="' + section.id + '">';
      html += '    <div class="bc-section-titlewrap">';
      html += '      <span class="bc-section-eyebrow">' + section.eyebrow[lang] + '</span>';
      html += '      <span class="bc-section-title">' + section.title[lang] + '</span>';
      html += '    </div>';
      html += '    <div class="bc-section-right">';
      html += '      <span class="bc-count">' + sectionDone + '/' + section.items.length + '</span>';
      html += chevronIcon();
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="bc-items">';
      if (section.note) {
        html += '  <div class="bc-note">' + t.noteIcon + ' <span>' + escapeHtml(section.note[lang]) + '</span></div>';
      }
      section.items.forEach((pair, i) => {
        const text = pair[lang][0];
        const hint = pair[lang][1];
        const itemId = section.id + '-' + i;
        const checked = !!state[itemId];
        html += '<div class="bc-item' + (checked ? ' done' : '') + '" data-item="' + itemId + '">';
        html += '  <div class="bc-checkbox' + (checked ? ' checked' : '') + '">' + checkIcon() + '</div>';
        html += '  <div class="bc-item-textwrap">';
        html += '    <div class="bc-item-text">' + escapeHtml(text) + '</div>';
        if (hint) {
          html += '    <div class="bc-item-hint">' + escapeHtml(hint) + '</div>';
        }
        html += '  </div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="bc-footer">';
    html += '  <button class="bc-reset" data-reset="1">' + t.reset + '</button>';
    html += '  <span class="bc-savenote">' + t.saved + '</span>';
    html += '</div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    root.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        const section = DATA.find((s) => s.id === id);
        section._open = section._open === false ? true : false;
        render();
      });
    });
    root.querySelectorAll('[data-item]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-item');
        state[id] = !state[id];
        render();
        persist();
      });
    });
    root.querySelectorAll('[data-lang]').forEach((el) => {
      el.addEventListener('click', () => {
        lang = el.getAttribute('data-lang');
        render();
        persistLang();
      });
    });
    const resetBtn = root.querySelector('[data-reset]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state = {};
        render();
        persist();
      });
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Impossible de sauvegarder la progression', e);
    }
  }

  function persistLang() {
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      console.error('Impossible de sauvegarder la langue', e);
    }
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { state = JSON.parse(saved); }
    } catch (e) {
      state = {};
    }
    try {
      const savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang) { lang = savedLang; }
    } catch (e) {
      lang = "fr";
    }
    render();
  }

  load();
})();
</script>

</body>
</html>
