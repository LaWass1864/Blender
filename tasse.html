<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma tasse à café</title>
</head>
<body style="margin:0; padding:24px 12px; background:#F0EDF7; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<div id="blender-checklist-root"></div>
<style>
  #blender-checklist-root {
    --purple: #5B3A8E;
    --purple-dark: #3B2760;
    --teal: #1F8A87;
    --gold: #C9A227;
    --cream: #FBF9F5;
    --ink: #2B2438;
    --grey: #6E6A78;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    border-radius: 20px;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(43,36,56,0.08);
  }

  .bc-hero {
    background: linear-gradient(135deg, var(--purple-dark), #4A3170);
    color: #fff;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .bc-hero::after {
    content: "";
    position: absolute;
    top: -60px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(201,162,39,0.18);
  }
  .bc-lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    z-index: 2;
  }
  .bc-lang-btn {
    border: none;
    background: transparent;
    color: #D9CFEE;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .bc-lang-btn.active {
    background: var(--gold);
    color: var(--purple-dark);
  }
  .bc-eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
    position: relative;
  }
  .bc-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    position: relative;
    padding-right: 90px;
  }
  .bc-sub {
    font-size: 13px;
    color: #D9CFEE;
    margin: 0 0 20px;
    position: relative;
    max-width: 480px;
  }
  .bc-progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bc-progress-track {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .bc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .bc-progress-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }

  .bc-body { padding: 10px 20px 22px; }

  .bc-section {
    border: 1px solid #E8E2D8;
    background: #fff;
    border-radius: 14px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bc-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    border-left: 5px solid var(--accent, var(--purple));
  }
  .bc-section-head:hover { background: #FBF9F5; }
  .bc-section-titlewrap { display: flex; flex-direction: column; gap: 2px; }
  .bc-section-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent, var(--purple));
  }
  .bc-section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .bc-section-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bc-count {
    font-size: 11.5px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 34px;
    text-align: right;
  }
  .bc-chevron {
    width: 18px; height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--grey);
  }
  .bc-section.open .bc-chevron { transform: rotate(180deg); }

  .bc-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .bc-section.open .bc-items { max-height: 3400px; }

  .bc-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 10px 16px 0;
    padding: 9px 12px;
    background: rgba(31,138,135,0.08);
    border: 1px solid rgba(31,138,135,0.35);
    border-radius: 10px;
    font-size: 11.8px;
    line-height: 1.35;
    color: var(--ink);
  }
  .bc-note strong { color: var(--teal); }
  .bc-note.warn {
    background: rgba(201,162,39,0.1);
    border-color: rgba(201,162,39,0.45);
  }

  .bc-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px 10px 20px;
    border-top: 1px solid #F1EDE3;
  }
  .bc-checkbox {
    margin-top: 2px;
    width: 19px; height: 19px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 2px solid #D7CFE6;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bc-checkbox.checked {
    background: var(--accent, var(--purple));
    border-color: var(--accent, var(--purple));
  }
  .bc-checkbox svg { width: 12px; height: 12px; opacity: 0; }
  .bc-checkbox.checked svg { opacity: 1; }
  .bc-item-textwrap { cursor: pointer; }
  .bc-item-text {
    font-size: 13.3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .bc-item-hint {
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--accent, var(--purple));
    margin-top: 3px;
    opacity: 0.85;
  }
  .bc-item-hint::before {
    content: "📍 ";
  }
  .bc-item.done .bc-item-text {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: #C9BFDD;
  }
  .bc-item.done .bc-item-hint { opacity: 0.4; }

  .bc-footer {
    padding: 4px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bc-reset {
    font-size: 12px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .bc-savenote {
    font-size: 11px;
    color: #A79EC0;
  }
</style>
<script>
(function () {
  const UI = {
    fr: {
      eyebrow: "Pratique personnelle",
      title: "Ma tasse à café",
      sub: "Coche chaque étape, du corps de la tasse jusqu'à l'anse et au rendu final. Le 📍 indique où trouver l'outil à l'écran.",
      reset: "Réinitialiser ma progression",
      saved: "Progression sauvegardée automatiquement",
      noteIcon: "🔍"
    },
    en: {
      eyebrow: "Personal practice",
      title: "My coffee mug",
      sub: "Check off each step, from the mug's body through the handle to the final render. The 📍 shows you where to find the tool on screen.",
      reset: "Reset my progress",
      saved: "Progress saved automatically",
      noteIcon: "🔍"
    }
  };

  const DATA = [
    {
      id: "s1", accent: "var(--gold)",
      title: { fr: "Le corps de la tasse", en: "The mug's body" },
      eyebrow: { fr: "Étape 1", en: "Step 1" },
      note: { fr: "Reprend la même logique que le verre (cylindre creusé + Subdivision), donc les gestes de base sont déjà connus.",
              en: "Follows the same logic as the glass (hollowed cylinder + Subdivision), so the base gestures are already familiar." },
      items: [
        { fr: ["Nettoyer la scène si besoin (X sur le cube par défaut, puis « Delete »)", "Clic gauche sur le cube pour le sélectionner (contour orange), puis X, clic sur Delete dans le petit menu"],
          en: ["Clear the scene if needed (X on the default cube, then « Delete »)", "Left-click the cube to select it (orange outline), then X, click Delete in the small menu"] },
        { fr: ["Ajouter un cylindre (Shift+A > Mesh > Cylinder)", "Souris dans le viewport, Shift+A ouvre le menu au niveau du curseur — survoler « Mesh » puis cliquer « Cylinder »"],
          en: ["Add a cylinder (Shift+A > Mesh > Cylinder)", "Mouse in the viewport, Shift+A opens the menu at the cursor — hover « Mesh » then click « Cylinder »"] },
        { fr: ["Ajuster le nombre de segments dans le panneau « Add Cylinder »", "Panneau déroulant en bas à gauche du viewport, juste après l'ajout — champ Vertices, 24 à 32 donne un bon équilibre rondeur/légèreté"],
          en: ["Adjust the number of segments in the « Add Cylinder » panel", "Collapsible panel bottom-left of the viewport, right after adding — Vertices field, 24 to 32 gives a good roundness/lightness balance"] },
        { fr: ["Passer en Edit Mode (Tab)", "Ou le menu déroulant en haut à gauche du viewport, qui passe de « Object Mode » à « Edit Mode »"],
          en: ["Switch to Edit Mode (Tab)", "Or the dropdown top-left of the viewport, switching from « Object Mode » to « Edit Mode »"] },
        { fr: ["Activer le mode Face (touche 3) et cliquer sur la face du dessus", "3e des 3 petites icônes en haut du viewport à côté de « Global » — la face sélectionnée devient orange"],
          en: ["Turn on Face mode (3 key) and click the top face", "3rd of the 3 small icons at the top of the viewport next to « Global » — the selected face turns orange"] },
        { fr: ["Supprimer cette face pour ouvrir la tasse (X > Faces)", "X ouvre un petit menu à l'endroit du curseur — bien choisir « Faces », pas « Vertices » ni « Edges », sinon ça supprime plus que prévu"],
          en: ["Delete that face to open up the mug (X > Faces)", "X opens a small menu at the cursor — pick « Faces », not « Vertices » or « Edges », otherwise it deletes more than intended"] },
        { fr: ["Sélectionner toute la boucle du bord supérieur (Alt+clic sur une arête du bord)", "Mode Edge (touche 2) recommandé — Alt+clic sélectionne toute la boucle d'un coup au lieu d'une seule arête"],
          en: ["Select the whole top rim loop (Alt+click an edge on the rim)", "Edge mode (2 key) recommended — Alt+click selects the entire loop at once instead of a single edge"] },
        { fr: ["Inset sur cette boucle pour amorcer la paroi intérieure (I)", "Bouger la souris vers l'intérieur pour réduire le contour, clic gauche pour valider — comme pour le verre"],
          en: ["Inset on this loop to start the inner wall (I)", "Move the mouse inward to shrink the outline, left-click to confirm — same as for the glass"] },
        { fr: ["Creuser l'intérieur vers le bas (E puis Z, ou juste E si l'axe se contraint tout seul)", "Extrude cette face réduite vers le bas pour créer le creux — s'arrêter avant de traverser le fond"],
          en: ["Hollow the inside downward (E then Z, or just E if the axis locks itself)", "Extrude that shrunk face downward to create the hollow — stop before poking through the bottom"] },
        { fr: ["Ajouter le modifier Subdivision Surface", "Icône clé à molette dans le panneau Propriétés à droite → Add Modifier → Generate → Subdivision Surface"],
          en: ["Add the Subdivision Surface modifier", "Wrench icon in the Properties panel on the right → Add Modifier → Generate → Subdivision Surface"] },
        { fr: ["Loop Cut près du bord supérieur, glisser légèrement vers le haut (Ctrl/Cmd+R)", "Même geste que pour le verre — garde le rebord net malgré l'arrondi du Subdivision"],
          en: ["Loop Cut near the top rim, slide slightly upward (Ctrl/Cmd+R)", "Same gesture as for the glass — keeps the rim crisp despite the Subdivision's rounding"] },
        { fr: ["Loop Cut près de la base, glisser légèrement vers le bas (Ctrl/Cmd+R)", "Empêche la base de gonfler comme un ballon sous l'effet du Subdivision"],
          en: ["Loop Cut near the base, slide slightly downward (Ctrl/Cmd+R)", "Stops the base from ballooning out under the Subdivision's effect"] },
        { fr: ["Revenir en Object Mode et appliquer Shade Smooth", "Tab pour sortir d'Edit Mode, puis clic droit sur l'objet → Shade Smooth dans le menu contextuel"],
          en: ["Go back to Object Mode and apply Shade Smooth", "Tab to exit Edit Mode, then right-click the object → Shade Smooth in the context menu"] }
      ]
    },
    {
      id: "s2", accent: "var(--purple)",
      title: { fr: "L'anse", en: "The handle" },
      eyebrow: { fr: "Étape 2", en: "Step 2" },
      note: { fr: "La partie la plus nouvelle : on dessine l'anse en extrudant une boucle plusieurs fois de suite, comme des petits segments de courbe, avant de la ressouder au corps.",
              en: "The most new part: you draw the handle by extruding a loop several times in a row, like small curve segments, before welding it back onto the body." },
      items: [
        { fr: ["Passer en vue de face pour se repérer (touche 1 du pavé numérique)", "Aide à juger la courbe de l'anse bien à plat pendant qu'on la construit"],
          en: ["Switch to front view to get your bearings (numpad key 1)", "Helps judge the handle's curve flat-on while building it"] },
        { fr: ["Repasser en Edge mode (2) et sélectionner une petite boucle verticale sur le côté extérieur", "Alt+clic sur une arête verticale du corps — choisis un point à mi-hauteur, côté où l'anse doit partir"],
          en: ["Switch back to Edge mode (2) and select a small vertical loop on the outer side", "Alt+click a vertical edge on the body — pick a point at mid-height, on the side where the handle should start"] },
        { fr: ["Extruder cette boucle vers l'extérieur (E, déplacer, clic gauche)", "1er segment de l'anse — vise un angle qui s'éloigne légèrement de la tasse, pas droit à l'horizontale"],
          en: ["Extrude that loop outward (E, move, left-click)", "1st segment of the handle — aim for an angle that moves slightly away from the mug, not straight horizontal"] },
        { fr: ["Extruder encore 2 à 3 fois pour dessiner la courbe de l'anse (E répété)", "Chaque E ajoute un segment — pense à une main qui dessinerait un arc à petits traits successifs plutôt qu'une seule courbe"],
          en: ["Extrude 2-3 more times to draw the handle's curve (repeated E)", "Each E adds a segment — think of a hand drawing an arc in small successive strokes rather than one single curve"] },
        { fr: ["Ramener le dernier segment vers le corps de la tasse, plus bas", "Le but est que ce dernier point touche (ou soit très proche de) la paroi extérieure, à un niveau inférieur au point de départ"],
          en: ["Bring the last segment back toward the mug's body, lower down", "The goal is for this last point to touch (or be very close to) the outer wall, at a level lower than the starting point"] },
        { fr: ["Sélectionner la dernière boucle de l'anse ET la boucle du corps où elle doit se souder", "Maj + Alt+clic pour ajouter une 2e boucle à la sélection sans perdre la première"],
          en: ["Select the handle's last loop AND the body loop it should weld onto", "Shift + Alt+click to add a 2nd loop to the selection without losing the first"] },
        { fr: ["Fermer l'anse avec Bridge Edge Loops", "Menu « Edge » en haut du viewport → « Bridge Edge Loops » — relie les 2 boucles sélectionnées par une nouvelle surface"],
          en: ["Close the handle with Bridge Edge Loops", "« Edge » menu at the top of the viewport → « Bridge Edge Loops » — connects the 2 selected loops with new geometry"] },
        { fr: ["Vérifier la jonction en tournant la vue (clic molette maintenu)", "L'anse doit sembler soudée au corps, sans trou visible ni double paroi qui se chevauche"],
          en: ["Check the join by orbiting the view (middle-click drag)", "The handle should look welded to the body, with no visible gap or overlapping double wall"] }
      ]
    },
    {
      id: "s3", accent: "var(--teal)",
      title: { fr: "Finitions et rendu", en: "Finishing touches and render" },
      eyebrow: { fr: "Étape 3", en: "Step 3" },
      items: [
        { fr: ["Bevel léger sur les arêtes du bord (Ctrl/Cmd+B)", "En mode Edge, sélectionner la boucle du bord supérieur, Ctrl+B puis bouger légèrement la souris — adoucit l'arête vive avant lissage"],
          en: ["Light Bevel on the rim edges (Ctrl/Cmd+B)", "In Edge mode, select the top rim loop, Ctrl+B then move the mouse slightly — softens the sharp edge before smoothing"] },
        { fr: ["Vérifier que l'anse est bien lissée elle aussi", "Si l'anse paraît anguleuse malgré Shade Smooth : ajouter 1-2 Loop Cuts supplémentaires le long de sa courbe"],
          en: ["Check that the handle is smoothed too", "If the handle looks blocky despite Shade Smooth: add 1-2 extra Loop Cuts along its curve"] },
        { fr: ["Ajouter un matériau à la tasse", "Panneau Propriétés à droite → icône ronde à damier (Material Properties) → « New » → choisir une couleur type céramique (Base Color)"],
          en: ["Add a material to the mug", "Properties panel on the right → round checkered icon (Material Properties) → « New » → pick a ceramic-style colour (Base Color)"] },
        { fr: ["Régler Roughness pour un effet céramique brillant", "Champ Roughness sous Base Color — une valeur basse (0.1-0.2) donne un aspect glacé, plus réaliste pour une tasse"],
          en: ["Adjust Roughness for a glossy ceramic effect", "Roughness field under Base Color — a low value (0.1-0.2) gives a glazed look, more realistic for a mug"] },
        { fr: ["Ajouter une lumière et une caméra si besoin", "Shift+A > Light > Point ou Area pour la lumière, Shift+A > Camera pour la caméra"],
          en: ["Add a light and a camera if needed", "Shift+A > Light > Point or Area for lighting, Shift+A > Camera for the camera"] },
        { fr: ["Passer en aperçu Matériau pour vérifier le rendu", "4 petites icônes en haut à droite du viewport — cliquer sur la 3e (dégradée)"],
          en: ["Switch to Material Preview to check the render", "4 small icons top-right of the viewport — click the 3rd one (shaded)"] },
        { fr: ["Sauvegarder le fichier (Cmd/Ctrl+S)", "Choisir un nom et un emplacement au premier enregistrement"],
          en: ["Save the file (Cmd/Ctrl+S)", "Choose a name and location on first save"] },
        { fr: ["Lancer le rendu final (F12)", "Ou en haut de l'écran : « Render » → « Render Image »"],
          en: ["Launch the final render (F12)", "Or at the top of the screen: « Render » → « Render Image »"] }
      ]
    }
  ];

  const STORAGE_KEY = "blender-mug-checklist-progress";
  const LANG_KEY = "blender-mug-checklist-progress-lang";
  let state = {};
  let lang = "fr";

  const root = document.getElementById("blender-checklist-root");

  function totalItems() {
    return DATA.reduce((acc, s) => acc + s.items.length, 0);
  }
  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronIcon() {
    return '<svg class="bc-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const t = UI[lang];
    const total = totalItems();
    const done = checkedCount();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = '';
    html += '<div class="bc-hero">';
    html += '  <div class="bc-lang-toggle">';
    html += '    <button class="bc-lang-btn' + (lang === 'fr' ? ' active' : '') + '" data-lang="fr">FR</button>';
    html += '    <button class="bc-lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>';
    html += '  </div>';
    html += '  <p class="bc-eyebrow">' + t.eyebrow + '</p>';
    html += '  <h1 class="bc-title">' + t.title + '</h1>';
    html += '  <p class="bc-sub">' + t.sub + '</p>';
    html += '  <div class="bc-progress-row">';
    html += '    <div class="bc-progress-track"><div class="bc-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div class="bc-progress-label">' + done + ' / ' + total + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="bc-body">';
    DATA.forEach((section) => {
      const sectionDone = section.items.filter((_, i) => state[section.id + '-' + i]).length;
      const isOpen = section._open !== false;
      html += '<div class="bc-section' + (isOpen ? ' open' : '') + '" data-section="' + section.id + '" style="--accent:' + section.accent + '">';
      html += '  <div class="bc-section-head" data-toggle="' + section.id + '">';
      html += '    <div class="bc-section-titlewrap">';
      html += '      <span class="bc-section-eyebrow">' + section.eyebrow[lang] + '</span>';
      html += '      <span class="bc-section-title">' + section.title[lang] + '</span>';
      html += '    </div>';
      html += '    <div class="bc-section-right">';
      html += '      <span class="bc-count">' + sectionDone + '/' + section.items.length + '</span>';
      html += chevronIcon();
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="bc-items">';
      if (section.note) {
        html += '  <div class="bc-note">' + t.noteIcon + ' <span>' + escapeHtml(section.note[lang]) + '</span></div>';
      }
      section.items.forEach((pair, i) => {
        const text = pair[lang][0];
        const hint = pair[lang][1];
        const itemId = section.id + '-' + i;
        const checked = !!state[itemId];
        html += '<div class="bc-item' + (checked ? ' done' : '') + '" data-item="' + itemId + '">';
        html += '  <div class="bc-checkbox' + (checked ? ' checked' : '') + '">' + checkIcon() + '</div>';
        html += '  <div class="bc-item-textwrap">';
        html += '    <div class="bc-item-text">' + escapeHtml(text) + '</div>';
        if (hint) {
          html += '    <div class="bc-item-hint">' + escapeHtml(hint) + '</div>';
        }
        html += '  </div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="bc-footer">';
    html += '  <button class="bc-reset" data-reset="1">' + t.reset + '</button>';
    html += '  <span class="bc-savenote">' + t.saved + '</span>';
    html += '</div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    root.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        const section = DATA.find((s) => s.id === id);
        section._open = section._open === false ? true : false;
        render();
      });
    });
    root.querySelectorAll('[data-item]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-item');
        state[id] = !state[id];
        render();
        persist();
      });
    });
    root.querySelectorAll('[data-lang]').forEach((el) => {
      el.addEventListener('click', () => {
        lang = el.getAttribute('data-lang');
        render();
        persistLang();
      });
    });
    const resetBtn = root.querySelector('[data-reset]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state = {};
        render();
        persist();
      });
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Impossible de sauvegarder la progression', e);
    }
  }

  function persistLang() {
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      console.error('Impossible de sauvegarder la langue', e);
    }
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { state = JSON.parse(saved); }
    } catch (e) {
      state = {};
    }
    try {
      const savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang) { lang = savedLang; }
    } catch (e) {
      lang = "fr";
    }
    render();
  }

  load();
})();
</script>

</body>
</html>
