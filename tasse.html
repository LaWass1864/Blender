<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma tasse à café</title>
</head>
<body style="margin:0; padding:24px 12px; background:#F0EDF7; font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<div id="blender-checklist-root"></div>
<style>
  #blender-checklist-root {
    --purple: #5B3A8E;
    --purple-dark: #3B2760;
    --teal: #1F8A87;
    --gold: #C9A227;
    --cream: #FBF9F5;
    --ink: #2B2438;
    --grey: #6E6A78;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    border-radius: 20px;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(43,36,56,0.08);
  }

  .bc-hero {
    background: linear-gradient(135deg, var(--purple-dark), #4A3170);
    color: #fff;
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .bc-hero::after {
    content: "";
    position: absolute;
    top: -60px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(201,162,39,0.18);
  }
  .bc-lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    z-index: 2;
  }
  .bc-lang-btn {
    border: none;
    background: transparent;
    color: #D9CFEE;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .bc-lang-btn.active {
    background: var(--gold);
    color: var(--purple-dark);
  }
  .bc-eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 0 6px;
    position: relative;
  }
  .bc-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 4px;
    position: relative;
    padding-right: 90px;
  }
  .bc-sub {
    font-size: 13px;
    color: #D9CFEE;
    margin: 0 0 20px;
    position: relative;
    max-width: 480px;
  }
  .bc-progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bc-progress-track {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .bc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .bc-progress-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    min-width: 70px;
    text-align: right;
  }

  .bc-body { padding: 10px 20px 22px; }

  .bc-section {
    border: 1px solid #E8E2D8;
    background: #fff;
    border-radius: 14px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bc-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    border-left: 5px solid var(--accent, var(--purple));
  }
  .bc-section-head:hover { background: #FBF9F5; }
  .bc-section-titlewrap { display: flex; flex-direction: column; gap: 2px; }
  .bc-section-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent, var(--purple));
  }
  .bc-section-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .bc-section-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .bc-count {
    font-size: 11.5px;
    color: var(--grey);
    white-space: nowrap;
    min-width: 34px;
    text-align: right;
  }
  .bc-chevron {
    width: 18px; height: 18px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--grey);
  }
  .bc-section.open .bc-chevron { transform: rotate(180deg); }

  .bc-items {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .bc-section.open .bc-items { max-height: 2200px; }

  .bc-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 10px 16px 0;
    padding: 9px 12px;
    background: rgba(31,138,135,0.08);
    border: 1px solid rgba(31,138,135,0.35);
    border-radius: 10px;
    font-size: 11.8px;
    line-height: 1.35;
    color: var(--ink);
  }
  .bc-note strong { color: var(--teal); }
  .bc-note.warn {
    background: rgba(201,162,39,0.1);
    border-color: rgba(201,162,39,0.45);
  }

  .bc-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 16px 10px 20px;
    border-top: 1px solid #F1EDE3;
  }
  .bc-checkbox {
    margin-top: 2px;
    width: 19px; height: 19px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 2px solid #D7CFE6;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .bc-checkbox.checked {
    background: var(--accent, var(--purple));
    border-color: var(--accent, var(--purple));
  }
  .bc-checkbox svg { width: 12px; height: 12px; opacity: 0; }
  .bc-checkbox.checked svg { opacity: 1; }
  .bc-item-textwrap { cursor: pointer; }
  .bc-item-text {
    font-size: 13.3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .bc-item-hint {
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--accent, var(--purple));
    margin-top: 3px;
    opacity: 0.85;
  }
  .bc-item-hint::before {
    content: "📍 ";
  }
  .bc-item.done .bc-item-text {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: #C9BFDD;
  }
  .bc-item.done .bc-item-hint { opacity: 0.4; }

  .bc-footer {
    padding: 4px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .bc-reset {
    font-size: 12px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .bc-savenote {
    font-size: 11px;
    color: #A79EC0;
  }
</style>
<script>
(function () {
  const UI = {
    fr: {
      eyebrow: "Pratique personnelle",
      title: "Ma tasse à café",
      sub: "Coche chaque étape en suivant le tuto Blender Guru (Partie 1, ~29 min). Le 📍 indique où trouver l'outil à l'écran.",
      reset: "Réinitialiser ma progression",
      saved: "Progression sauvegardée automatiquement",
      noteIcon: "🔍"
    },
    en: {
      eyebrow: "Personal practice",
      title: "My coffee mug",
      sub: "Check off each step while following the Blender Guru tutorial (Part 1, ~29 min). The 📍 shows you where to find the tool on screen.",
      reset: "Reset my progress",
      saved: "Progress saved automatically",
      noteIcon: "🔍"
    }
  };

  const DATA = [
    {
      id: "s1", accent: "var(--gold)",
      title: { fr: "Tasse à café — Blender Guru", en: "Coffee mug — Blender Guru" },
      eyebrow: { fr: "Donut 5.0, Partie 1", en: "Donut 5.0, Part 1" },
      note: { fr: "Basé sur les chapitres officiels de la vidéo (pas une transcription complète). Réutilise 90% de la boîte à outils du tuto maison — seuls Shade Smooth et Delete Face sont vraiment nouveaux.",
              en: "Based on the video's official chapter markers (not a full transcript). Reuses 90% of the house tutorial's toolkit — only Shade Smooth and Delete Face are genuinely new." },
      items: [
        { fr: ["Ajouter un cylindre comme base de la tasse (Shift+A > Mesh > Cylinder)", "Ou le menu Add en haut du viewport — c'est le point de départ de la tasse"],
          en: ["Add a cylinder as the base of the mug (Shift+A > Mesh > Cylinder)", "Or the Add menu at the top of the viewport — the starting point for the mug"] },
        { fr: ["Appliquer Shade Smooth (clic droit > Shade Smooth)", "Nouveau : lisse l'apparence sans ajouter de géométrie — menu Object en haut, ou clic droit sur l'objet"],
          en: ["Apply Shade Smooth (right-click > Shade Smooth)", "New: smooths the appearance without adding geometry — Object menu at the top, or right-click the object"] },
        { fr: ["Passer en Edit Mode, sélectionner la face du dessus (Face mode, 3)", "Icônes de sélection en haut du viewport, à côté de Global"],
          en: ["Switch to Edit Mode, select the top face (Face mode, 3)", "Selection icons at the top of the viewport, next to Global"] },
        { fr: ["Supprimer cette face pour créer l'ouverture de la tasse (X > Faces)", "Nouveau : X ouvre un menu, choisir « Faces » (pas juste Delete simple)"],
          en: ["Delete that face to create the mug's opening (X > Faces)", "New: X opens a menu, choose « Faces » (not just a simple delete)"] },
        { fr: ["Ajouter le modifier Subdivision Surface (Modifiers > Add Modifier > Generate > Subdivision Surface)", "Déjà vu — même emplacement que pour la maison"],
          en: ["Add the Subdivision Surface modifier (Modifiers > Add Modifier > Generate > Subdivision Surface)", "Already seen — same location as for the house"] },
        { fr: ["Ajouter des Loop Cuts pour contrôler l'arrondi (Ctrl/Cmd+R)", "Déjà vu — barre d'outils à gauche ou raccourci clavier"],
          en: ["Add Loop Cuts to control the roundness (Ctrl/Cmd+R)", "Already seen — left toolbar or keyboard shortcut"] },
        { fr: ["Utiliser l'outil Inset pour l'épaisseur de la tasse (I)", "Déjà vu — sur la face intérieure ou extérieure selon la paroi à épaissir"],
          en: ["Use the Inset tool for the mug's thickness (I)", "Already seen — on the inner or outer face depending on which wall to thicken"] },
        { fr: ["Ajuster l'épaisseur de la paroi de la tasse", "Régler la distance d'Inset, ou déplacer les points intérieurs (G)"],
          en: ["Adjust the thickness of the mug's wall", "Adjust the Inset distance, or move the inner points (G)"] },
        { fr: ["Sauvegarder le fichier (Cmd/Ctrl+S)", "Nouveau : choisir un nom et un emplacement au premier enregistrement"],
          en: ["Save the file (Cmd/Ctrl+S)", "New: choose a name and location on first save"] }
      ]
    }
  ];

  const STORAGE_KEY = "blender-mug-checklist-progress";
  const LANG_KEY = "blender-mug-checklist-progress-lang";
  let state = {};
  let lang = "fr";

  const root = document.getElementById("blender-checklist-root");

  function totalItems() {
    return DATA.reduce((acc, s) => acc + s.items.length, 0);
  }
  function checkedCount() {
    return Object.values(state).filter(Boolean).length;
  }

  function checkIcon() {
    return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronIcon() {
    return '<svg class="bc-chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const t = UI[lang];
    const total = totalItems();
    const done = checkedCount();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = '';
    html += '<div class="bc-hero">';
    html += '  <div class="bc-lang-toggle">';
    html += '    <button class="bc-lang-btn' + (lang === 'fr' ? ' active' : '') + '" data-lang="fr">FR</button>';
    html += '    <button class="bc-lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>';
    html += '  </div>';
    html += '  <p class="bc-eyebrow">' + t.eyebrow + '</p>';
    html += '  <h1 class="bc-title">' + t.title + '</h1>';
    html += '  <p class="bc-sub">' + t.sub + '</p>';
    html += '  <div class="bc-progress-row">';
    html += '    <div class="bc-progress-track"><div class="bc-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '    <div class="bc-progress-label">' + done + ' / ' + total + '</div>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="bc-body">';
    DATA.forEach((section) => {
      const sectionDone = section.items.filter((_, i) => state[section.id + '-' + i]).length;
      const isOpen = section._open !== false;
      html += '<div class="bc-section' + (isOpen ? ' open' : '') + '" data-section="' + section.id + '" style="--accent:' + section.accent + '">';
      html += '  <div class="bc-section-head" data-toggle="' + section.id + '">';
      html += '    <div class="bc-section-titlewrap">';
      html += '      <span class="bc-section-eyebrow">' + section.eyebrow[lang] + '</span>';
      html += '      <span class="bc-section-title">' + section.title[lang] + '</span>';
      html += '    </div>';
      html += '    <div class="bc-section-right">';
      html += '      <span class="bc-count">' + sectionDone + '/' + section.items.length + '</span>';
      html += chevronIcon();
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="bc-items">';
      if (section.note) {
        const isWarn = section.noteType === 'warn';
        const noteClass = isWarn ? ' warn' : '';
        const prefix = isWarn ? '' : (t.noteIcon + ' ');
        html += '  <div class="bc-note' + noteClass + '"><span>' + prefix + escapeHtml(section.note[lang]) + '</span></div>';
      }
      section.items.forEach((pair, i) => {
        const text = pair[lang][0];
        const hint = pair[lang][1];
        const itemId = section.id + '-' + i;
        const checked = !!state[itemId];
        html += '<div class="bc-item' + (checked ? ' done' : '') + '" data-item="' + itemId + '">';
        html += '  <div class="bc-checkbox' + (checked ? ' checked' : '') + '">' + checkIcon() + '</div>';
        html += '  <div class="bc-item-textwrap">';
        html += '    <div class="bc-item-text">' + escapeHtml(text) + '</div>';
        if (hint) {
          html += '    <div class="bc-item-hint">' + escapeHtml(hint) + '</div>';
        }
        html += '  </div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="bc-footer">';
    html += '  <button class="bc-reset" data-reset="1">' + t.reset + '</button>';
    html += '  <span class="bc-savenote">' + t.saved + '</span>';
    html += '</div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    root.querySelectorAll('[data-toggle]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-toggle');
        const section = DATA.find((s) => s.id === id);
        section._open = section._open === false ? true : false;
        render();
      });
    });
    root.querySelectorAll('[data-item]').forEach((el) => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-item');
        state[id] = !state[id];
        render();
        persist();
      });
    });
    root.querySelectorAll('[data-lang]').forEach((el) => {
      el.addEventListener('click', () => {
        lang = el.getAttribute('data-lang');
        render();
        persistLang();
      });
    });
    const resetBtn = root.querySelector('[data-reset]');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state = {};
        render();
        persist();
      });
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Impossible de sauvegarder la progression', e);
    }
  }

  function persistLang() {
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {
      console.error('Impossible de sauvegarder la langue', e);
    }
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { state = JSON.parse(saved); }
    } catch (e) {
      state = {};
    }
    try {
      const savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang) { lang = savedLang; }
    } catch (e) {
      lang = "fr";
    }
    render();
  }

  load();
})();
</script>

</body>
</html>
